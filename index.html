<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raidingdud | Developer Menu</title>
    <style>
        /* Loads the Minecraft font */
        @font-face {
            font-family: 'MinecraftFont';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Classic Dirt Background */
        body {
            /* Fallback dark brown, but uses dirt.png if you add it to the folder */
            background-color: #3f2a14;
            background-image: url('dirt.png'); 
            background-size: 64px 64px; /* Scales up a 16x16 texture perfectly */
            background-repeat: repeat;
            image-rendering: pixelated;
            
            color: #ffffff;
            font-family: 'MinecraftFont', monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        /* Main Menu Container */
        .menu-container {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -50px;
        }

        /* Logo Area */
        .logo-container {
            position: relative;
            margin-bottom: 60px;
            text-align: center;
        }

        .logo {
            font-size: 4.5rem;
            color: #ffffff;
            text-shadow: 4px 4px 0px #3f3f3f;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Yellow Splashtext */
        .splash {
            position: absolute;
            bottom: -20px;
            right: -40px;
            color: #ffff55;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #3f3f3f;
            transform: rotate(-20deg);
            animation: splashThrob 0.4s infinite alternate;
            white-space: nowrap;
        }

        @keyframes splashThrob {
            from { transform: rotate(-20deg) scale(1); }
            to { transform: rotate(-20deg) scale(1.1); }
        }

        /* Button Layout */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* Authentic CSS Minecraft Buttons */
        .mc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #7D7D7D;
            border: 2px solid #000000;
            /* Creates the 3D bevel effect natively in CSS */
            box-shadow: inset 2px 2px 0px 0px #9E9E9E, inset -2px -2px 0px 0px #585858;
            color: #ffffff;
            text-shadow: 2px 2px 0px #3F3F3F;
            font-family: 'MinecraftFont', monospace;
            font-size: 1.2rem;
            text-decoration: none;
            height: 40px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        /* Half-width buttons */
        .mc-btn.half {
            width: 48%; /* Leaves a small gap between them */
        }

        /* Hover Effect (Turns text yellow) */
        .mc-btn:hover {
            color: #ffffaa;
            /* Minecraft buttons usually get a slight outline highlight on hover in newer versions */
            border-color: #ffffff;
        }

        /* Footer Text Overlay */
        .footer-left {
            position: fixed;
            bottom: 5px;
            left: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #3f3f3f;
            font-size: 1rem;
        }

        .footer-right {
            position: fixed;
            bottom: 5px;
            right: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #3f3f3f;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        
        <!-- Title & Splash Text -->
        <div class="logo-container">
            <h1 class="logo">Raidingdud</h1>
            <div class="splash">Developer Edition!</div>
        </div>

        <!-- Classic Menu Buttons -->
        <div class="button-group">
            <a href="#" class="mc-btn">My Projects & Mods</a>
            <a href="#" class="mc-btn">GitHub Profile</a>
            <a href="#" class="mc-btn">Discord Server</a>
            
            <div class="button-row">
                <a href="#" class="mc-btn half">About Me</a>
                <a href="#" class="mc-btn half">Contact</a>
            </div>
        </div>

    </div>

    <!-- Bottom corners text, like the real game -->
    <div class="footer-left">Raidingdud Web v1.0</div>
    <div class="footer-right">Copyright DOC. Do not distribute!</div>

</body>
</html>
