<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Mod Name] - Minecraft Mod</title>
    <style>
        /* Loads your custom font */
        @font-face {
            font-family: 'MinecraftFont';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Core styling with dark purple gradient */
        body {
            /* A deep, dark purple in the center fading to pure black at the edges */
            background: radial-gradient(circle at center, #1b0525 0%, #000000 70%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'MinecraftFont', monospace, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Page load animation */
        @keyframes fadeInSlide {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            animation: fadeInSlide 1.2s ease-out forwards;
        }

        /* Continuous glowing animation for the title (Purple) */
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px #3a005c; }
            50% { text-shadow: 0 0 15px #9400D3, 0 0 25px #9400D3; }
            100% { text-shadow: 0 0 5px #3a005c; }
        }

        /* Dark Purple heading */
        h1 {
            color: #9400D3; /* Vibrant dark purple */
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: pulseGlow 3s infinite alternate;
        }

        /* White text */
        p {
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 50px;
        }

        /* Blocky Minecraft-style Buttons */
        .btn {
            display: inline-block;
            background-color: transparent;
            color: #9400D3;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: 4px solid #9400D3;
            margin: 10px;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hover effect for main button */
        .btn:hover {
            background-color: #9400D3;
            color: #ffffff; /* Switched to white on hover for better contrast against purple */
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(148, 0, 211, 0.3);
        }

        /* Specific styling for the Modrinth button */
        .btn-modrinth {
            border-color: #1bd96a; /* Kept Modrinth's official brand green */
            color: #1bd96a;
        }

        .btn-modrinth:hover {
            background-color: #1bd96a;
            color: #000000;
            box-shadow: 0 10px 15px rgba(27, 217, 106, 0.2);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            color: #666666;
            animation: fadeInSlide 1.5s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Add your mod name here later -->
        <h1>[Mod Name]</h1>
        
        <p>Welcome to the official page for [Mod Name]. Add a brief description of what your mod does, the features it adds to the game, and any dependencies (like Fabric API) it might need.</p>
        
        <!-- Direct File Download -->
        <a href="YOUR_MOD_FILE.jar" download class="btn">Download .JAR</a>

        <!-- Modrinth Link -->
        <a href="YOUR_MODRINTH_LINK_HERE" target="_blank" rel="noopener noreferrer" class="btn btn-modrinth">View on Modrinth</a>
    </div>

    <footer>
        <p>&copy; 2026 DOC. Built for Minecraft.</p>
    </footer>

</body>
</html>
