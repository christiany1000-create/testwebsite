<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qwack!</title>
  
  <style>
    /* CSS Variables for easy color management */
    :root {
      --primary-gradient: linear-gradient(135deg, #ff8c00, #ffd700);
      --text-dark: #1a1a1a;
      --bg-color: #f4f4f9;
    }

    /* Basic Page Reset & Layout */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    /* Main Header Styling */
    header {
      background: var(--primary-gradient);
      color: var(--text-dark);
      width: 100%;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px; /* Space between logo and text */
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .logo-img {
      height: 50px; /* Adjust this to fit your image perfectly */
      width: auto;
    }

    .logo-text {
      margin: 0;
      font-size: 2.2rem;
      font-weight: bold;
    }

    /* Chat Container Styling */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    #chat-container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 70vh;
    }

    .chat-header {
      background: var(--primary-gradient);
      color: var(--text-dark);
      padding: 15px;
      text-align: center;
      margin: 0;
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Messages Area */
    #messages {
      flex: 1;
      list-style: none;
      padding: 20px;
      margin: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.4;
    }

    /* Message Bubbles */
    .user-message {
      background: var(--primary-gradient);
      color: var(--text-dark);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .other-message {
      background: #e9ecef;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* Chat Input Area */
    .chat-input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }

    #chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-right: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: #ff8c00;
    }

    #send-btn {
      background: var(--primary-gradient);
      color: var(--text-dark);
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
    }

    #send-btn:hover {
      opacity: 0.9;
    }
    
    #send-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <img src="assets/quacklogo.png" alt="qwack! logo" class="logo-img">
    <h1 class="logo-text">qwack!</h1>
  </header>

  <main>
    <div id="chat-container">
      <div class="chat-header">
        qwack!
      </div>
      
      <ul id="messages">
        <li class="message other-message">Welcome to qwack! How can I help you?</li>
        <li class="message user-message">This new orange and yellow theme looks great!</li>
      </ul>
      
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type your message here...">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </main>

</body>
</html>
