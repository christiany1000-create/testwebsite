<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shorts • LearnMultiply</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #050505; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        /* Feed container with smooth snap scrolling */
        .feed { 
            height: 100vh; overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            background: #000;
        }

        .short-container { 
            height: 100vh; width: 100vw; 
            position: relative; 
            scroll-snap-align: start; 
            scroll-snap-stop: always;
            display: flex; justify-content: center; align-items: center; 
            background: #111;
        }

        .video-player { 
            width: 100%; height: 100%; 
            border: none; pointer-events: auto;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* Top Navigation Bar */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            backdrop-filter: blur(4px);
        }

        .logo-title {
            font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px;
            background: linear-gradient(45deg, #ff3333, #ff6b6b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .auth-container {
            display: flex; align-items: center; gap: 10px;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d;
        }
        .status-dot.signed-in {
            background: #2ecc71; box-shadow: 0 0 8px #2ecc71;
        }

        .auth-btn { 
            background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 14px; border-radius: 20px; 
            font-weight: 600; cursor: pointer; font-size: 13px;
            backdrop-filter: blur(8px); transition: all 0.2s ease;
        }
        .auth-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* Sleek Info Panel (Bottom Left) */
        .info-panel { 
            position: absolute; bottom: 35px; left: 16px; 
            z-index: 10; max-width: 72%; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .channel-info {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 20px;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px; cursor: pointer; pointer-events: auto;
            transition: background 0.2s;
        }
        .channel-info:active { background: rgba(0,0,0,0.7); }
        .channel-info h3 { margin: 0; font-size: 0.9rem; font-weight: 600; color: #f1f1f1; }
        
        .video-title { 
            margin: 0; font-size: 0.95rem; line-height: 1.35; 
            font-weight: 400; color: #e1e1e1;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            pointer-events: auto;
        }

        /* Glassmorphism Action Buttons (Bottom Right) */
        .overlay-actions { 
            position: absolute; bottom: 40px; right: 12px; 
            display: flex; flex-direction: column; gap: 16px; 
            align-items: center; z-index: 10; 
        }

        .action-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }

        .action-btn { 
            background: rgba(30, 30, 30, 0.55); border: 1px solid rgba(255, 255, 255, 0.12); 
            color: white; border-radius: 50%; width: 48px; height: 48px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; backdrop-filter: blur(12px); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
        }
        .action-btn:active { transform: scale(0.85); background: rgba(255, 0, 0, 0.6); border-color: rgba(255,0,0,0.4); }
        .action-btn svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .action-count {
            font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            color: #f1f1f1;
        }

        /* Modern Modals & Drawers */
        .modal {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 200; justify-content: center; align-items: flex-end;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; }

        .modal-card {
            background: #141414; width: 100%; max-height: 80vh;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px; border: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px;
        }
        .modal-header h3 { margin: 0; font-size: 1.1rem; font-weight: 700; }
        
        .close-icon-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 30px; height: 30px; border-radius: 50%; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Comments List */
        .comments-list {
            overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px;
            padding-right: 4px; margin-bottom: 15px;
        }
        .comment-item {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .comment-author { font-size: 12px; font-weight: 600; color: #aaa; margin-bottom: 4px; }
        .comment-text { font-size: 13px; color: #ddd; line-height: 1.4; margin: 0; word-break: break-word; }

        .comment-input-area {
            display: flex; gap: 10px; align-items: center;
            background: rgba(255,255,255,0.06); border-radius: 24px; padding: 6px 6px 6px 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .comment-input {
            flex: 1; background: transparent; border: none; color: #fff; font-size: 14px;
            outline: none;
        }
        .send-btn {
            background: #ff0033; color: white; border: none; border-radius: 20px;
            padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer;
        }

        /* Channel View Modal Styling */
        .channel-modal-content {
            background: #181818; padding: 30px 20px; border-radius: 20px;
            text-align: center; width: 90%; max-width: 340px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .channel-modal-content h2 { margin: 0 0 15px 0; font-size: 1.3rem; }
        .stat-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0;
        }
        .stat-box { background: rgba(255,255,255,0.05); padding: 12px 8px; border-radius: 10px; }
        .stat-value { font-size: 15px; font-weight: 700; color: #ff3333; margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }

        .loading-screen {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 12px; color: #888; font-size: 14px; background: #000;
        }
        .spinner {
            width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ff0033; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo-title">LearnMultiply Shorts</div>
        <div class="auth-container">
            <div id="auth-status-dot" class="status-dot"></div>
            <button id="auth-btn" class="auth-btn" onclick="handleAuthClick()">Sign In</button>
        </div>
    </div>

    <div class="feed" id="feed">
        <div class="loading-screen">
            <div class="spinner"></div>
            <span>Loading your personalized feed...</span>
        </div>
    </div>

    <!-- Comments Modal Drawer -->
    <div class="modal" id="comments-modal">
        <div class="modal-card" style="height: 65vh;">
            <div class="modal-header">
                <h3 id="comments-header-title">Comments</h3>
                <button class="close-icon-btn" onclick="closeCommentsModal()">✕</button>
            </div>
            <div class="comments-list" id="comments-list-container">
                <!-- Comments injected dynamically -->
            </div>
            <div class="comment-input-area">
                <input type="text" id="comment-text-input" class="comment-input" placeholder="Add a comment...">
                <button class="send-btn" onclick="postComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- Channel Info Modal -->
    <div class="modal" id="channel-modal" style="align-items: center;">
        <div class="channel-modal-content">
            <h2 id="modal-title">Channel Name</h2>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-value" id="modal-subs">0</div>
                    <div class="stat-label">Subs</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="modal-views">0</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="modal-videos">0</div>
                    <div class="stat-label">Videos</div>
                </div>
            </div>
            <button class="auth-btn" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.08);" onclick="closeChannelModal()">Close</button>
        </div>
    </div>

    <!-- Google Identity Services and Google API Client Library -->
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>

    <script>
        // === CONFIGURATION ===
        const CLIENT_ID = '787259726635-ldace8nm63t3ehiog8189pekts6138dc.apps.googleusercontent.com'; 
        const API_KEY = 'AIzaSyDw9lwxRVpxFOMAAsd8dotB4Nf1aiuyOBE';
        const DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest'];
        const SCOPES = 'https://www.googleapis.com/auth/youtube.force-ssl';

        let tokenClient;
        let isAuthenticated = false;
        let activeVideoId = null;

        // Initialize Google API Client
        async function gapiLoaded() {
            await gapi.load('client', async () => {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: DISCOVERY_DOCS,
                });
                loadShorts();
            });
        }

        // Initialize Google Identity Services
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        isAuthenticated = true;
                        document.getElementById('auth-btn').innerText = 'Sign Out';
                        document.getElementById('auth-btn').onclick = handleSignoutClick;
                        document.getElementById('auth-status-dot').classList.add('signed-in');
                        
                        document.getElementById('feed').innerHTML = '<div class="loading-screen"><div class="spinner"></div><span>Loading your subscribed feed...</span></div>';
                        loadShorts();
                    }
                },
            });
        }

        function handleAuthClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    isAuthenticated = false;
                    document.getElementById('auth-btn').innerText = 'Sign In';
                    document.getElementById('auth-btn').onclick = handleAuthClick;
                    document.getElementById('auth-status-dot').classList.remove('signed-in');
                    
                    document.getElementById('feed').innerHTML = '<div class="loading-screen"><div class="spinner"></div><span>Loading feed...</span></div>';
                    loadShorts();
                });
            }
        }

        // Fetch YouTube Shorts Feed
        async function loadShorts() {
            const feed = document.getElementById('feed');

            try {
                let items = [];

                if (isAuthenticated) {
                    try {
                        const subsResponse = await gapi.client.youtube.subscriptions.list({
                            part: 'snippet',
                            mine: true,
                            maxResults: 25
                        });
                        const channels = subsResponse.result.items;
                        if (channels && channels.length > 0) {
                            const randomChannel = channels[Math.floor(Math.random() * channels.length)];
                            const subVideos = await gapi.client.youtube.search.list({
                                part: 'snippet',
                                channelId: randomChannel.snippet.resourceId.channelId,
                                maxResults: 10,
                                type: 'video',
                                videoDuration: 'short',
                                videoEmbeddable: 'true',
                                order: 'date'
                            });
                            if (subVideos.result.items && subVideos.result.items.length > 0) {
                                items = subVideos.result.items;
                            }
                        }
                    } catch (subErr) {
                        console.warn('Subscription fetch fallback triggered:', subErr);
                    }
                }

                if (items.length === 0) {
                    const generalResponse = await gapi.client.youtube.search.list({
                        part: 'snippet',
                        q: '#shorts',
                        maxResults: 15,
                        type: 'video',
                        videoDuration: 'short',
                        videoEmbeddable: 'true',
                        order: 'relevance'
                    });
                    items = generalResponse.result.items || [];
                }
                
                feed.innerHTML = ''; 

                if (items.length === 0) {
                    feed.innerHTML = '<div class="loading-screen"><span>No videos found. Check API quota.</span></div>';
                    return;
                }

                items.forEach((item, index) => {
                    if (!item.id || item.id.kind !== 'youtube#video') return; 

                    const videoId = item.id.videoId;
                    const channelId = item.snippet.channelId;
                    const title = item.snippet.title;
                    const channelTitle = item.snippet.channelTitle;

                    // First video plays immediately, others wait for scroll intersection
                    const autoplayVal = index === 0 ? 1 : 0;

                    const shortHtml = `
                        <div class="short-container" data-videoid="${videoId}">
                            <iframe class="video-player" 
                                src="https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1&autoplay=${autoplayVal}&mute=0&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0&playsinline=1&origin=${window.location.origin}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                            <div class="info-panel">
                                <div class="channel-info" onclick="viewChannel('${channelId}')">
                                    <h3>@${channelTitle}</h3>
                                </div>
                                <p class="video-title">${title}</p>
                            </div>
                            <div class="overlay-actions">
                                <div class="action-item">
                                    <button class="action-btn" onclick="likeVideo('${videoId}')" title="Like">
                                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    </button>
                                    <span class="action-count">Like</span>
                                </div>
                                <div class="action-item">
                                    <button class="action-btn" onclick="openCommentsModal('${videoId}', '${title.replace(/'/g, "\\'")}')" title="Comment">
                                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                                    </button>
                                    <span class="action-count">Chat</span>
                                </div>
                                <div class="action-item">
                                    <button class="action-btn" onclick="subscribeChannel('${channelId}')" title="Subscribe">
                                        <svg viewBox="0 0 24 24"><path d="M19 10.5V8h-2.5v2.5H14V13h2.5v2.5H19V13h2.5v-2.5H19zM12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/></svg>
                                    </button>
                                    <span class="action-count">Sub</span>
                                </div>
                            </div>
                        </div>
                    `;
                    feed.insertAdjacentHTML('beforeend', shortHtml);
                });

                setupScrollAutoplay();

            } catch (err) {
                console.error('Error loading shorts', err);
                feed.innerHTML = '<div class="loading-screen"><span>Error loading videos. Check API Key & Quota.</span></div>';
            }
        }

        // Intersection Observer for seamless auto-play & pause on scroll
        function setupScrollAutoplay() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const iframe = entry.target.querySelector('iframe');
                    if (!iframe || !iframe.contentWindow) return;

                    if (entry.isIntersecting) {
                        iframe.contentWindow.postMessage(JSON.stringify({
                            event: 'command',
                            func: 'playVideo',
                            args: ''
                        }), '*');
                    } else {
                        iframe.contentWindow.postMessage(JSON.stringify({
                            event: 'command',
                            func: 'pauseVideo',
                            args: ''
                        }), '*');
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll('.short-container').forEach(container => {
                observer.observe(container);
            });
        }

        // Like Video
        async function likeVideo(videoId) {
            if (!isAuthenticated) return alert('Please sign in to like videos');
            try {
                await gapi.client.youtube.videos.rate({ id: videoId, rating: 'like' });
                alert('Liked video!');
            } catch (err) {
                console.error('Like error:', err);
                alert('Error liking video. Ensure permissions are granted.');
            }
        }

        // Open Comments Modal & Fetch Comments
        async function openCommentsModal(videoId, videoTitle) {
            activeVideoId = videoId;
            document.getElementById('comments-header-title').innerText = videoTitle;
            document.getElementById('comments-list-container').innerHTML = '<div style="text-align:center; padding: 30px; color:#777;"><div class="spinner" style="margin: 0 auto 10px auto;"></div>Loading comments...</div>';
            document.getElementById('comments-modal').classList.add('active');

            try {
                const response = await gapi.client.youtube.commentThreads.list({
                    part: 'snippet',
                    videoId: videoId,
                    maxResults: 15
                });
                
                const comments = response.result.items;
                const container = document.getElementById('comments-list-container');
                container.innerHTML = '';

                if (!comments || comments.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 30px; color:#777;">No comments found for this video.</div>';
                    return;
                }

                comments.forEach(item => {
                    const snippet = item.snippet.topLevelComment.snippet;
                    const author = snippet.authorDisplayName;
                    const text = snippet.textDisplay;

                    const commentEl = `
                        <div class="comment-item">
                            <div class="comment-author">${author}</div>
                            <div class="comment-text">${text}</div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', commentEl);
                });
            } catch (err) {
                console.error('Error fetching comments:', err);
                document.getElementById('comments-list-container').innerHTML = '<div style="text-align:center; padding: 30px; color:#ff4d4d;">Comments are disabled or unavailable for this video.</div>';
            }
        }

        function closeCommentsModal() {
            document.getElementById('comments-modal').classList.remove('active');
        }

        // Post Comment
        async function postComment() {
            if (!isAuthenticated) return alert('Please sign in to post comments');
            const input = document.getElementById('comment-text-input');
            const text = input.value.trim();
            if (!text || !activeVideoId) return;

            try {
                await gapi.client.youtube.commentThreads.insert({
                    part: 'snippet',
                    resource: {
                        snippet: {
                            videoId: activeVideoId,
                            topLevelComment: {
                                snippet: { textOriginal: text }
                            }
                        }
                    }
                });
                input.value = '';
                alert('Comment posted!');
                openCommentsModal(activeVideoId, document.getElementById('comments-header-title').innerText);
            } catch (err) {
                console.error('Comment post error:', err);
                alert('Failed to post comment.');
            }
        }

        // Subscribe Channel
        async function subscribeChannel(channelId) {
            if (!isAuthenticated) return alert('Please sign in to subscribe');
            try {
                await gapi.client.youtube.subscriptions.insert({
                    part: 'snippet',
                    resource: {
                        snippet: {
                            resourceId: { kind: 'youtube#channel', channelId: channelId }
                        }
                    }
                });
                alert('Subscribed successfully!');
            } catch (err) {
                console.error('Subscribe error:', err);
                alert('Already subscribed or error occurred.');
            }
        }

        // View Channel Modal
        async function viewChannel(channelId) {
            try {
                const response = await gapi.client.youtube.channels.list({
                    part: 'snippet,statistics',
                    id: channelId
                });
                const channel = response.result.items[0];
                
                document.getElementById('modal-title').innerText = channel.snippet.title;
                document.getElementById('modal-subs').innerText = Number(channel.statistics.subscriberCount).toLocaleString();
                document.getElementById('modal-views').innerText = Number(channel.statistics.viewCount).toLocaleString();
                document.getElementById('modal-videos').innerText = Number(channel.statistics.videoCount).toLocaleString();
                
                document.getElementById('channel-modal').classList.add('active');
            } catch (err) {
                console.error('Channel info error:', err);
                alert('Could not load channel info.');
            }
        }

        function closeChannelModal() {
            document.getElementById('channel-modal').classList.remove('active');
        }
    </script>
</body>
</html>
