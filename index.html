<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply | Ultimate Unblocked Games & Media</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #131c2e;
            --surface-glass: rgba(19, 28, 46, 0.75);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.4);
            --accent: #a855f7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        }

        /* Navigation Bar */
        header {
            background-color: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Top Nav Tabs */
        .top-nav {
            display: flex;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.3rem;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 1.1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-tab:hover {
            color: var(--text);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 240px;
        }

        .search-bar {
            width: 100%;
            padding: 0.55rem 1rem 0.55rem 2.4rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .search-bar:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background-color: rgba(255, 255, 255, 0.06);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.85rem;
        }

        .settings-btn {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .settings-btn:hover {
            border-color: var(--primary);
            background-color: rgba(6, 182, 212, 0.1);
            transform: translateY(-1px);
        }

        /* Main Layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Sub-Category Filter Tabs for Games */
        .categories {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out;
        }

        .cat-btn {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .cat-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            transform: translateY(-2px);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* Card Component */
        .card {
            background-color: var(--surface);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            animation: cardEntrance 0.6s ease-out backwards;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--primary);
            box-shadow: 0 15px 30px -10px rgba(6, 182, 212, 0.3);
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 170px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card-content {
            padding: 1.25rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            background: rgba(6, 182, 212, 0.1);
            padding: 0.25rem 0.7rem;
            border-radius: 99px;
        }

        /* Modal Base */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        /* Player Modal */
        .modal-player {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Settings Modal Panel */
        .settings-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.2rem;
            padding: 2rem;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .settings-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .settings-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-item-info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .settings-item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 0.6rem;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        /* Numpad Modal Specifics */
        .numpad-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.2rem;
            padding: 2rem;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .numpad-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .pin-display {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 6px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            margin-bottom: 1.2rem;
            width: 100%;
            text-align: center;
            color: var(--primary);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            width: 100%;
            margin-bottom: 1rem;
        }

        .numpad-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.9rem 0;
            border-radius: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .numpad-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            transform: scale(1.03);
        }

        /* Animations */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .header-left {
                width: 100%;
                justify-content: space-between;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .search-container {
                max-width: 100%;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="#" class="logo">⚡ LearnMultiply</a>
            <div class="top-nav">
                <button class="nav-tab active" id="navGames" onclick="switchMainTab('Games')">Games</button>
                <button class="nav-tab" id="navVideos" onclick="switchMainTab('Videos')">Videos</button>
            </div>
        </div>
        <div class="header-right">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-bar" placeholder="Search...">
            </div>
            <button class="settings-btn" onclick="openSettingsModal()">⚙️ Settings</button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1 id="heroTitle">Level Up Your Break</h1>
            <p id="heroSubtitle">The ultimate collection of high-performance unblocked games & media.</p>
        </div>

        <!-- Sub-category Filter Tabs for Games -->
        <div class="categories" id="categoryFilters">
            <button class="cat-btn active" data-category="All">All Games</button>
            <button class="cat-btn" data-category="Adventure">Adventure</button>
            <button class="cat-btn" data-category="Arcade">Arcade</button>
            <button class="cat-btn" data-category="Classic">Classic</button>
            <button class="cat-btn" data-category="Strategy">Strategy</button>
        </div>

        <div class="grid" id="gameGrid">
            <!-- Dynamic Grid Elements -->
        </div>
    </div>

    <!-- Modal Player -->
    <div class="modal-player" id="gameModal">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin: 0; font-size: 1.2rem;">Title</h3>
            <button class="close-btn" onclick="closeGame()">Close Player</button>
        </div>
        <div class="iframe-container">
            <iframe id="gameIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="pointer-lock; fullscreen; autoplay; keyboard-map; clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-box">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" style="padding: 0.3rem 0.8rem;" onclick="closeSettingsModal()">✕</button>
            </div>

            <div class="settings-item">
                <div class="settings-item-info">
                    <h4>Admin Access</h4>
                    <p>Enter passkey code</p>
                </div>
                <button class="action-btn" onclick="openAdminFromSettings()">Admin Code</button>
            </div>

            <button class="close-btn" onclick="closeSettingsModal()" style="width: 100%; padding: 0.7rem; background: var(--surface); border: 1px solid var(--border);">Close</button>
        </div>
    </div>

    <!-- Admin Numpad Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="numpad-box">
            <div class="numpad-title">Enter Admin Code</div>
            <div id="pinDisplay" class="pin-display">_ _ _ _ _ _</div>
            <div class="numpad-grid">
                <button class="numpad-btn" onclick="pressKey('1')">1</button>
                <button class="numpad-btn" onclick="pressKey('2')">2</button>
                <button class="numpad-btn" onclick="pressKey('3')">3</button>
                <button class="numpad-btn" onclick="pressKey('4')">4</button>
                <button class="numpad-btn" onclick="pressKey('5')">5</button>
                <button class="numpad-btn" onclick="pressKey('6')">6</button>
                <button class="numpad-btn" onclick="pressKey('7')">7</button>
                <button class="numpad-btn" onclick="pressKey('8')">8</button>
                <button class="numpad-btn" onclick="pressKey('9')">9</button>
                <button class="numpad-btn" onclick="clearPin()">C</button>
                <button class="numpad-btn" onclick="pressKey('0')">0</button>
                <button class="numpad-btn" onclick="submitPin()">↵</button>
            </div>
            <button class="close-btn" onclick="closeAdminModal()" style="width: 100%; padding: 0.7rem;">Cancel</button>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyDwfmW1IQ6raSNlXW7NNDUty3KBdF-bGlY";

        const games = [
            {
                title: "Super Mario 64",
                category: "Adventure",
                image: "https://placehold.co/400x250/ef4444/ffffff?text=Super+Mario+64",
                url: "sm64/index.html"
            },
            {
                title: "Craft",
                category: "Adventure",
                image: "https://placehold.co/400x250/06b6d4/ffffff?text=Craft", 
                url: "craft.html",
                directLink: true
            },
            {
                title: "Gulper.io",
                category: "Arcade",
                image: "https://placehold.co/400x250/3b82f6/ffffff?text=Gulper.io",
                url: "https://gulper.io/"
            },
            {
                title: "Flappy Bird Clone",
                category: "Arcade",
                image: "https://placehold.co/400x250/10b981/ffffff?text=Flappy+Bird",
                url: "https://flappybird.io/"
            },
            {
                title: "Pac-Man",
                category: "Classic",
                image: "https://placehold.co/400x250/eab308/000000?text=Pac-Man",
                url: "https://freepacman.org/"
            },
            {
                title: "Tetris Clone",
                category: "Arcade",
                image: "https://placehold.co/400x250/a855f7/ffffff?text=Tetris",
                url: "https://tetris.com/play-tetris"
            },
            {
                title: "Doodle Jump",
                category: "Arcade",
                image: "https://placehold.co/400x250/ec4899/ffffff?text=Doodle+Jump",
                url: "https://poki.com/en/g/doodle-jump"
            },
            {
                title: "Chess",
                category: "Strategy",
                image: "https://placehold.co/400x250/64748b/ffffff?text=Chess",
                url: "https://www.chess.com/play/computer"
            }
        ];

        let youtubeVideos = [];
        let currentMainTab = 'Games';
        let currentGameCategory = 'All';
        let searchTimeout = null;
        let enteredPin = "";

        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('gameModal');
        const iframe = document.getElementById('gameIframe');
        const modalTitle = document.getElementById('modalTitle');
        const categoryButtons = document.querySelectorAll('.cat-btn');
        const categoryFilters = document.getElementById('categoryFilters');
        
        const settingsModal = document.getElementById('settingsModal');
        const adminModal = document.getElementById('adminModal');
        const pinDisplay = document.getElementById('pinDisplay');

        // Top Nav Main Tab Switcher
        function switchMainTab(tab) {
            currentMainTab = tab;
            document.getElementById('navGames').classList.toggle('active', tab === 'Games');
            document.getElementById('navVideos').classList.toggle('active', tab === 'Videos');

            if (tab === 'Games') {
                categoryFilters.style.display = 'flex';
                document.getElementById('heroTitle').textContent = "Level Up Your Break";
                document.getElementById('heroSubtitle').textContent = "The ultimate collection of high-performance unblocked games.";
                filterAndRender();
            } else if (tab === 'Videos') {
                categoryFilters.style.display = 'none';
                document.getElementById('heroTitle').textContent = "Trending Videos";
                document.getElementById('heroSubtitle').textContent = "Watch gaming streams, highlights, and videos.";
                if (youtubeVideos.length === 0) {
                    fetchYouTubeVideos(searchInput.value.trim() || "gaming highlights");
                } else {
                    filterAndRender();
                }
            }
        }

        // Settings Modal Functions
        function openSettingsModal() {
            settingsModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeSettingsModal() {
            settingsModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function openAdminFromSettings() {
            closeSettingsModal();
            openAdminModal();
        }

        // Admin Numpad Functions
        function openAdminModal() {
            adminModal.style.display = 'flex';
            enteredPin = "";
            updatePinDisplay();
            document.body.style.overflow = 'hidden';
        }

        function closeAdminModal() {
            adminModal.style.display = 'none';
            enteredPin = "";
            document.body.style.overflow = 'auto';
        }

        function pressKey(digit) {
            if (enteredPin.length < 6) {
                enteredPin += digit;
                updatePinDisplay();
            }
        }

        function clearPin() {
            enteredPin = "";
            updatePinDisplay();
        }

        function updatePinDisplay() {
            if (enteredPin.length === 0) {
                pinDisplay.textContent = "_ _ _ _ _ _";
            } else {
                let displayStr = "";
                for (let i = 0; i < 6; i++) {
                    displayStr += (i < enteredPin.length ? "• " : "_ ");
                }
                pinDisplay.textContent = displayStr.trim();
            }
        }

        function submitPin() {
            if (enteredPin === "370018") {
                alert("This Website is by Christian");
                closeAdminModal();
            } else {
                alert("Incorrect Code");
                clearPin();
            }
        }

        async function fetchYouTubeVideos(query = "gaming highlights") {
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                
                if (data.items) {
                    youtubeVideos = data.items.map(item => ({
                        title: item.snippet.title,
                        category: "YouTube",
                        image: item.snippet.thumbnails.high.url,
                        url: `https://www.youtube.com/embed/${item.id.videoId}?autoplay=1`,
                        isYouTube: true
                    }));
                    if (currentMainTab === 'Videos') filterAndRender();
                } else if (data.error) {
                    grid.innerHTML = `<p style="color: #ef4444; grid-column: 1 / -1; text-align: center; padding: 3rem;">API Error: ${data.error.message}</p>`;
                }
            } catch (err) {
                console.error("Failed to fetch YouTube videos", err);
            }
        }

        function renderItems(itemList) {
            grid.innerHTML = '';
            
            if (itemList.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 3rem;">No items found.</p>';
                return;
            }

            itemList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openItem(item);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <span class="card-category">${item.category}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterAndRender() {
            const term = searchInput.value.toLowerCase();
            let pool = [];

            if (currentMainTab === 'Games') {
                if (currentGameCategory === 'All') {
                    pool = games;
                } else {
                    pool = games.filter(g => g.category === currentGameCategory);
                }
            } else {
                pool = youtubeVideos;
            }

            const filtered = pool.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.category.toLowerCase().includes(term)
            );

            renderItems(filtered);
        }

        function openItem(item) {
            if (item.directLink) {
                window.location.href = item.url;
                return;
            }

            modalTitle.textContent = item.title;
            iframe.src = item.url;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            iframe.onload = () => {
                iframe.focus();
            };
        }

        function closeGame() {
            modal.style.display = 'none';
            iframe.src = '';
            document.body.style.overflow = 'auto';
        }

        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim();
            if (currentMainTab === 'Videos') {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    fetchYouTubeVideos(term || "gaming highlights");
                }, 600);
            } else {
                filterAndRender();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentGameCategory = e.target.getAttribute('data-category');
                filterAndRender();
            });
        });

        // Initialize page
        filterAndRender();
    </script>
</body>
</html>
