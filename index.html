<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply | Ultimate Unblocked Games & Media</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #131c2e;
            --surface-glass: rgba(19, 28, 46, 0.75);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.4);
            --accent: #a855f7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        }

        /* Navigation Bar */
        header {
            background-color: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-bar {
            width: 100%;
            padding: 0.65rem 1.2rem 0.65rem 2.6rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .search-bar:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background-color: rgba(255, 255, 255, 0.06);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.9rem;
        }

        /* Main Layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Category Filter Tabs */
        .categories {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out;
        }

        .cat-btn {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .cat-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            transform: translateY(-2px);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* Game Card */
        .card {
            background-color: var(--surface);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            animation: cardEntrance 0.6s ease-out backwards;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--primary);
            box-shadow: 0 15px 30px -10px rgba(6, 182, 212, 0.3);
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 170px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card-content {
            padding: 1.25rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            background: rgba(6, 182, 212, 0.1);
            padding: 0.25rem 0.7rem;
            border-radius: 99px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Animations */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .search-container {
                max-width: 100%;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">⚡ LearnMultiply</a>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search games or videos...">
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Level Up Your Break</h1>
            <p>The ultimate collection of high-performance unblocked games & media.</p>
        </div>

        <div class="categories" id="categoryFilters">
            <button class="cat-btn active" data-category="All">All Items</button>
            <button class="cat-btn" data-category="Adventure">Adventure</button>
            <button class="cat-btn" data-category="Arcade">Arcade</button>
            <button class="cat-btn" data-category="Classic">Classic</button>
            <button class="cat-btn" data-category="Strategy">Strategy</button>
            <button class="cat-btn" data-category="YouTube">📺 YouTube Videos</button>
        </div>

        <div class="grid" id="gameGrid">
            <!-- Dynamic Grid Elements -->
        </div>
    </div>

    <!-- Modal Player -->
    <div class="modal" id="gameModal">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin: 0; font-size: 1.2rem;">Title</h3>
            <button class="close-btn" onclick="closeGame()">Close Player</button>
        </div>
        <div class="iframe-container">
            <iframe id="gameIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="pointer-lock; fullscreen; autoplay; keyboard-map; clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyDwfmW1IQ6raSNlXW7NNDUty3KBdF-bGlY";

        const games = [
            {
                title: "Craft",
                category: "Adventure",
                image: "https://placehold.co/400x250/06b6d4/ffffff?text=Craft", 
                url: "craft.html",
                directLink: true
            },
            {
                title: "Gulper.io",
                category: "Arcade",
                image: "https://placehold.co/400x250/3b82f6/ffffff?text=Gulper.io",
                url: "https://gulper.io/"
            },
            {
                title: "Flappy Bird Clone",
                category: "Arcade",
                image: "https://placehold.co/400x250/10b981/ffffff?text=Flappy+Bird",
                url: "https://flappybird.io/"
            },
            {
                title: "Pac-Man",
                category: "Classic",
                image: "https://placehold.co/400x250/eab308/000000?text=Pac-Man",
                url: "https://freepacman.org/"
            },
            {
                title: "Tetris Clone",
                category: "Arcade",
                image: "https://placehold.co/400x250/a855f7/ffffff?text=Tetris",
                url: "https://tetris.com/play-tetris"
            },
            {
                title: "Doodle Jump",
                category: "Arcade",
                image: "https://placehold.co/400x250/ec4899/ffffff?text=Doodle+Jump",
                url: "https://poki.com/en/g/doodle-jump"
            },
            {
                title: "Chess",
                category: "Strategy",
                image: "https://placehold.co/400x250/64748b/ffffff?text=Chess",
                url: "https://www.chess.com/play/computer"
            }
        ];

        let youtubeVideos = [];
        let currentCategory = 'All';
        let searchTimeout = null;

        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('gameModal');
        const iframe = document.getElementById('gameIframe');
        const modalTitle = document.getElementById('modalTitle');
        const categoryButtons = document.querySelectorAll('.cat-btn');

        async function fetchYouTubeVideos(query = "gaming highlights") {
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();
                
                if (data.items) {
                    youtubeVideos = data.items.map(item => ({
                        title: item.snippet.title,
                        category: "YouTube",
                        image: item.snippet.thumbnails.high.url,
                        url: `https://www.youtube.com/embed/${item.id.videoId}?autoplay=1`,
                        isYouTube: true
                    }));
                    filterAndRender();
                } else if (data.error) {
                    grid.innerHTML = `<p style="color: #ef4444; grid-column: 1 / -1; text-align: center; padding: 3rem;">API Error: ${data.error.message}</p>`;
                }
            } catch (err) {
                console.error("Failed to fetch YouTube videos", err);
            }
        }

        function renderItems(itemList) {
            grid.innerHTML = '';
            
            if (itemList.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 3rem;">No items found.</p>';
                return;
            }

            itemList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openItem(item);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <span class="card-category">${item.category}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterAndRender() {
            const term = searchInput.value.toLowerCase();
            
            let pool = [];
            if (currentCategory === 'All') {
                pool = [...games, ...youtubeVideos];
            } else if (currentCategory === 'YouTube') {
                pool = youtubeVideos;
            } else {
                pool = games.filter(g => g.category === currentCategory);
            }

            const filtered = pool.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.category.toLowerCase().includes(term)
            );

            renderItems(filtered);
        }

        function openItem(item) {
            if (item.directLink) {
                window.location.href = item.url;
                return;
            }

            modalTitle.textContent = item.title;
            iframe.src = item.url;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            iframe.onload = () => {
                iframe.focus();
            };
        }

        function closeGame() {
            modal.style.display = 'none';
            iframe.src = '';
            document.body.style.overflow = 'auto';
        }

        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim();
            if (currentCategory === 'YouTube') {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    fetchYouTubeVideos(term || "gaming highlights");
                }, 600);
            } else {
                filterAndRender();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                
                if (currentCategory === 'YouTube' && youtubeVideos.length === 0) {
                    fetchYouTubeVideos(searchInput.value.trim() || "gaming highlights");
                } else {
                    filterAndRender();
                }
            });
        });

        fetchYouTubeVideos();
    </script>
</body>
</html>
