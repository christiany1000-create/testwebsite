<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qwack! - Portal & Live Chat</title>
  
  <!-- Firebase App & Database SDKs for the working chat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #ff8c00, #ffd700);
      --text-dark: #1a1a1a;
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --text-light: #f4f4f9;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: var(--primary-gradient);
      color: var(--text-dark);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 45px;
      width: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(0, 0, 0, 0.15);
      border: none;
      color: var(--text-dark);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .nav-btn:hover, .nav-btn.active {
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .content-pane {
      flex: 2;
      padding: 20px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .content-pane.active {
      display: flex;
    }

    .chat-pane {
      flex: 1;
      background: var(--panel-bg);
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      max-width: 400px;
      min-width: 320px;
    }

    .chat-header {
      background: var(--primary-gradient);
      color: var(--text-dark);
      padding: 12px;
      font-weight: bold;
      text-align: center;
      font-size: 1.1rem;
    }

    #messages {
      flex: 1;
      list-style: none;
      padding: 15px;
      margin: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .message.mine {
      background: var(--primary-gradient);
      color: var(--text-dark);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.theirs {
      background: #2a2a2a;
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      display: flex;
      padding: 12px;
      background: #181818;
      border-top: 1px solid #333;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #444;
      background: #252525;
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #ff8c00;
    }

    .send-btn {
      background: var(--primary-gradient);
      color: var(--text-dark);
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="assets/quacklogo.png" alt="qwack! logo" class="logo-img">
      <h1>qwack!</h1>
    </div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('games', event)">Games & Eaglercraft</button>
      <button class="nav-btn" onclick="switchTab('media', event)">YouTube Search</button>
    </nav>
  </header>

  <div class="main-container">
    <!-- Main Content Area -->
    <div style="flex: 2; display: flex; flex-direction: column; overflow: hidden;">
      
      <!-- Games Section -->
      <div id="games-tab" class="content-pane active">
        <div class="card">
          <h3>Unblocked Games & Eaglercraft</h3>
          <p>Play your favorite HTML5 titles and Minecraft web clients directly in the browser.</p>
          <!-- Replace source with your game frame / Eaglercraft container -->
          <div style="background: #000; height: 400px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #666;">
            [ Embedded Eaglercraft / Game Viewport ]
          </div>
        </div>
      </div>

      <!-- YouTube Search Section -->
      <div id="media-tab" class="content-pane">
        <div class="card">
          <h3>Media Hub</h3>
          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="yt-query" placeholder="Search YouTube videos...">
            <button class="send-btn" onclick="searchYouTube()">Search</button>
          </div>
          <div id="yt-results" style="color: #888;">Search results will display here.</div>
        </div>
      </div>

    </div>

    <!-- qwack! Live Chat Pane -->
    <div class="chat-pane">
      <div class="chat-header">qwack! Live Chat</div>
      <ul id="messages">
        <li class="message theirs">System: Connected to qwack! chat backend.</li>
      </ul>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Tab Switching Logic
    function switchTab(tabName, event) {
      document.querySelectorAll('.content-pane').forEach(pane => pane.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName + '-tab').classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Firebase Chat Integration (Replace config with your Firebase project details)
    const firebaseConfig = {
      databaseURL: "https://YOUR-FIREBASE-APP.firebaseio.com"
    };
    
    // Initialize Firebase (Safely checks if already initialized)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('messages');

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text === "") return;

      dbRef.push({
        text: text,
        timestamp: Date.now()
      });
      input.value = "";
    }

    function checkEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // Listen for incoming live chat messages in real time
    dbRef.limitToLast(50).on('child_added', snapshot => {
      const msgData = snapshot.val();
      const messagesList = document.getElementById('messages');
      const li = document.createElement('li');
      li.className = "message theirs";
      li.textContent = msgData.text;
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    });

    function searchYouTube() {
      const query = document.getElementById('yt-query').value;
      if (!query) return;
      document.getElementById('yt-results').innerHTML = `<p>Showing results for: <strong>${query}</strong></p>`;
    }
  </script>
</body>
</html>
