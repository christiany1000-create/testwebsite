<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Mod Name] - Minecraft Mod</title>
    <style>
        /* Loads your custom font */
        @font-face {
            font-family: 'MinecraftFont';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Core styling */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MinecraftFont', monospace, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
        }

        /* Green heading */
        h1 {
            color: #55FF55; /* Classic Minecraft Green */
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* White text */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 50px;
        }

        /* Blocky Minecraft-style Buttons */
        .btn {
            display: inline-block;
            background-color: #000000;
            color: #55FF55;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: 4px solid #55FF55;
            margin: 10px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hover effect for buttons */
        .btn:hover {
            background-color: #55FF55;
            color: #000000;
            transform: scale(1.05);
        }

        /* Specific styling for the Modrinth button */
        .btn-modrinth {
            border-color: #1bd96a; /* Modrinth's brand green */
            color: #1bd96a;
        }

        .btn-modrinth:hover {
            background-color: #1bd96a;
            color: #000000;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Add your mod name here later -->
        <h1>[Mod Name]</h1>
        
        <p>Welcome to the official page for [Mod Name]. Add a brief description of what your mod does, the features it adds to the game, and any dependencies (like Fabric API) it might need.</p>
        
        <!-- Direct File Download. Point the href to your actual .jar file -->
        <a href="YOUR_MOD_FILE.jar" download class="btn">Download .JAR</a>

        <!-- Modrinth Link -->
        <a href="YOUR_MODRINTH_LINK_HERE" target="_blank" rel="noopener noreferrer" class="btn btn-modrinth">View on Modrinth</a>
    </div>

    <footer>
        <p>&copy; 2026 DOC. Built for Minecraft.</p>
    </footer>

</body>
</html>
