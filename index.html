<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply</title>
    <style>/* --- Font Setup --- */
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- CSS Variables for Light/Dark Mode --- */
        :root {
            --bg-base: #121212;
            --bg-surface: #1e1e2f;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: #2a2a40;
            --accent: #FF5722; /* Solid Deep Orange for borders */
            --accent-gradient: linear-gradient(135deg, #FF3D00, #FFCA28); /* Firebase Red to Yellow */
            --accent-hover: linear-gradient(135deg, #DD2C00, #FF9800);
            --shadow: rgba(0, 0, 0, 0.6);
            --thumb-bg: #2c2c44;
            --thumb-bg-hover: #3a3a5c;
        }

        .light-mode {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --text-main: #1c1e21;
            --text-muted: rgba(0, 0, 0, 0.6);
            --border-color: #d1d5db;
            --accent: #FF3D00; 
            --accent-gradient: linear-gradient(135deg, #FF3D00, #FF9800);
            --accent-hover: linear-gradient(135deg, #DD2C00, #F57C00);
            --shadow: rgba(0, 0, 0, 0.1);
            --thumb-bg: #e5e7eb;
            --thumb-bg-hover: #d1d5db;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Minecraft', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Header --- */
        header {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow);
            border-bottom: 3px solid var(--accent);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2.2rem;
            letter-spacing: 2px;
            /* Text Gradient Magic */
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        /* --- Sliders --- */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--accent-gradient); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Layout --- */
        .content-area { width: 95%; max-width: 1200px; margin-top: 30px; flex-grow: 1; }
        .view-section { display: none; animation: fadeIn 0.5s ease forwards; }
        .view-section.active { display: block; }

        /* --- Games View --- */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        .game-card { background-color: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; text-decoration: none; color: var(--text-main); display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
        .game-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 10px 20px rgba(255, 87, 34, 0.2); border-color: var(--accent); }
        .thumbnail { width: 100%; height: 140px; background: var(--thumb-bg); display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--border-color); transition: background 0.3s; }
        .game-card:hover .thumbnail { background: var(--thumb-bg-hover); }
        .thumbnail-icon { font-size: 3rem; color: var(--text-muted); }
        .game-title { padding: 15px; text-align: center; font-size: 1.2rem; }

        /* --- Live Chat View --- */
        #chat-view { height: 75vh; }
        .chat-container { display: flex; height: 100%; background-color: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px var(--shadow); position: relative; }
        
        /* Auth Overlay */
        #auth-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; }
        #login-btn { padding: 15px 30px; font-size: 1.2rem; background: var(--accent-gradient); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; margin-top: 20px; transition: opacity 0.2s; }
        #login-btn:hover { opacity: 0.9; }

        .chat-sidebar { width: 250px; background-color: var(--bg-surface); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 2px solid var(--border-color); }
        .sidebar-header h2 { margin: 0 0 15px 0; font-size: 1.5rem; }
        .create-btn { width: 100%; padding: 10px; background: var(--accent-gradient); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .create-btn:hover { background: var(--accent-hover); }
        .group-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; }
        .group-list li { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
        .group-list li:hover { background-color: var(--thumb-bg); }
        .group-list li.active-group { border-left: 5px solid var(--accent); background-color: var(--thumb-bg); font-weight: bold; }

        .chat-main { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-base); }
        .chat-header { padding: 20px; background-color: var(--bg-surface); border-bottom: 2px solid var(--border-color); font-size: 1.5rem; display: flex; justify-content: space-between; }
        #logout-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        
        .messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { background-color: var(--bg-surface); padding: 12px 15px; border-radius: 8px; max-width: 70%; align-self: flex-start; border: 1px solid var(--border-color); word-wrap: break-word;}
        .message.own-message { align-self: flex-end; border-color: var(--accent); background-color: var(--thumb-bg); }
        .message-author { font-size: 0.9rem; color: var(--accent); margin-bottom: 5px; }
        
        .chat-input { padding: 20px; background-color: var(--bg-surface); border-top: 2px solid var(--border-color); display: flex; gap: 15px; }
        .chat-input input { flex-grow: 1; padding: 12px 15px; border-radius: 6px; border: 2px solid var(--border-color); background-color: var(--bg-base); color: var(--text-main); font-family: inherit; font-size: 1rem; outline: none; }
        .chat-input input:focus { border-color: var(--accent); }
        .chat-input button { padding: 0 25px; background: var(--accent-gradient); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s; }
        .chat-input button:active { transform: scale(0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }</style>
</head>
<body>

    <header>
        <div class="logo">LearnMultiply</div>
        <div class="nav-controls">
            <div class="toggle-group">
                <span>Games</span>
                <label class="switch"><input type="checkbox" id="view-toggle"><span class="slider"></span></label>
                <span>Live Chat</span>
            </div>
            <div class="toggle-group">
                <span>☀️</span>
                <label class="switch"><input type="checkbox" id="theme-toggle" checked><span class="slider"></span></label>
                <span>🌙</span>
            </div>
        </div>
    </header>

    <main class="content-area">
        
<!-- === GAMES VIEW === -->
        <div id="games-view" class="view-section active">
            <div class="games-grid">
                
                <!-- Eaglercraft Game Card -->
                <a href="craft.html" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">⛏️</span></div>
                    <div class="game-title">Eaglercraft</div>
                </a>

                <!-- Example Game 2 -->
                <a href="#" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">?</span></div>
                    <div class="game-title">Example Game 2</div>
                </a>
            </div>
        </div>

        <div id="chat-view" class="view-section">
            <div class="chat-container">
                
                <div id="auth-overlay">
                    <h2>Classroom Chat</h2>
                    <p>Please sign in with your Google account to chat.</p>
                    <button id="login-btn">Sign in with Google</button>
                </div>

                <div class="chat-sidebar">
                    <div class="sidebar-header">
                        <h2>Groups</h2>
                        <button class="create-btn" onclick="alert('Creating groups coming soon!')">+ New Group</button>
                    </div>
                    <ul class="group-list">
                        <li class="active-group"># Main Hub</li>
                    </ul>
                </div>

                <div class="chat-main">
                    <div class="chat-header">
                        <span># Main Hub</span>
                        <button id="logout-btn" style="display:none;">Log Out</button>
                    </div>
                    <div class="messages-area" id="messages-container">
                        </div>
                    <div class="chat-input">
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                        <button id="send-btn">Send</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // View Toggle Logic
        const viewToggle = document.getElementById('view-toggle');
        const gamesView = document.getElementById('games-view');
        const chatView = document.getElementById('chat-view');

        viewToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                gamesView.classList.remove('active');
                setTimeout(() => chatView.classList.add('active'), 50);
            } else {
                chatView.classList.remove('active');
                setTimeout(() => gamesView.classList.add('active'), 50);
            }
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.remove('light-mode');
            } else {
                document.body.classList.add('light-mode');
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // ==============================================================
        // ⚠️ PASTE YOUR FIREBASE CONFIGURATION HERE ⚠️
        // ==============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyATd0AhKa4v8rS4viCXETkjZ16V6e1VjsY",
            authDomain: "learnmultiply.firebaseapp.com",
            projectId: "learnmultiply",
            storageBucket: "learnmultiply.firebasestorage.app",
            messagingSenderId: "328977544347",
            appId: "1:328977544347:web:1330f41590b4805854423e"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const authOverlay = document.getElementById('auth-overlay');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let currentUser = null;

        // --- AUTHENTICATION ---
        loginBtn.addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(error => console.error("Login failed:", error));
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Listen for login/logout state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authOverlay.style.display = 'none'; // Hide login screen
                logoutBtn.style.display = 'block';  // Show logout button
                loadMessages();                     // Start fetching messages
            } else {
                currentUser = null;
                authOverlay.style.display = 'flex'; // Show login screen
                logoutBtn.style.display = 'none';   // Hide logout button
                messagesContainer.innerHTML = '';   // Clear messages
            }
        });

        // --- DATABASE LOGIC (Sending & Receiving) ---

        // Send a message
        const sendMessage = async () => {
            const text = messageInput.value.trim();
            if (text === "" || !currentUser) return;
            
            messageInput.value = ''; // Clear input immediately
            
            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    author: currentUser.displayName,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error writing message: ", error);
            }
        };

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Load and display messages in real-time
        let unsubscribe = null; // Used to stop listening to old messages when logging out
        
        function loadMessages() {
            if (unsubscribe) unsubscribe(); // clear existing listeners

            // Query the last 50 messages, ordered by time
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(50));
            
            // onSnapshot listens for real-time updates from Firestore
            unsubscribe = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = ''; // Clear chat window
                
                snapshot.forEach((doc) => {
                    const message = doc.data();
                    const isOwnMessage = message.uid === currentUser.uid;
                    
                    // Create HTML element for message
                    const msgElement = document.createElement('div');
                    msgElement.classList.add('message');
                    if (isOwnMessage) msgElement.classList.add('own-message');
                    
                    msgElement.innerHTML = `
                        <div class="message-author">${isOwnMessage ? 'You' : message.author}</div>
                        <div>${message.text}</div>
                    `;
                    
                    messagesContainer.appendChild(msgElement);
                });
                
                // Auto-scroll to the bottom of the chat
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }
    </script>

</body>
</html>
