<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply</title>
    <style>
        /* Load the local Minecraft font */
        @font-face {
            font-family: 'Minecraft';
            /* Note: If the file is actually .otf, make sure the name matches exactly */
            src: url('minecraft.oft') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Base Theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Minecraft', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header / Navbar */
        header {
            width: 100%;
            background-color: #1e1e2f;
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid #4CAF50;
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            margin: 0;
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #4CAF50; /* A green accent to fit the 'learning' disguise */
            text-shadow: 4px 4px 0px #000000;
            animation: float 4s ease-in-out infinite;
        }

        /* Grid Layout for Games */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 35px;
            padding: 50px 20px;
            width: 90%;
            max-width: 1200px;
        }

        /* Individual Game Card Button */
        .game-card {
            background-color: #1e1e2f;
            border: 2px solid #2a2a40;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            /* Smooth transitions for hover animations */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
            animation: fadeIn 0.8s ease-out backwards;
        }

        /* Staggered entrance animation for multiple cards */
        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.2s; }
        .game-card:nth-child(3) { animation-delay: 0.3s; }

        /* Hover Animation */
        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }

        /* Placeholder image area */
        .thumbnail {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #2c2c44, #1a1a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #2a2a40;
            transition: background 0.3s ease;
        }

        .game-card:hover .thumbnail {
            background: linear-gradient(135deg, #3a3a5c, #24243e);
        }

        .thumbnail-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .game-title {
            padding: 20px 15px;
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        /* Keyframe Animations */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>LearnMultiply</h1>
    </header>

    <main class="games-grid">
        
        <!-- Example Game Button 1 -->
        <a href="#" class="game-card">
            <div class="thumbnail">
                <span class="thumbnail-icon">?</span>
            </div>
            <div class="game-title">Example Game 1</div>
        </a>

        <!-- Example Game Button 2 -->
        <a href="#" class="game-card">
            <div class="thumbnail">
                <span class="thumbnail-icon">?</span>
            </div>
            <div class="game-title">Example Game 2</div>
        </a>

        <!-- Example Game Button 3 -->
        <a href="#" class="game-card">
            <div class="thumbnail">
                <span class="thumbnail-icon">?</span>
            </div>
            <div class="game-title">Example Game 3</div>
        </a>

    </main>

</body>
</html>
