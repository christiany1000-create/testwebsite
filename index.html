<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.oft') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- CSS Variables for Light/Dark Mode --- */
        :root {
            --bg-base: #121212;
            --bg-surface: #1e1e2f;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: #2a2a40;
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --shadow: rgba(0, 0, 0, 0.6);
            --thumb-bg: #2c2c44;
            --thumb-bg-hover: #3a3a5c;
        }

        /* Light Mode Overrides */
        .light-mode {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --text-main: #1c1e21;
            --text-muted: rgba(0, 0, 0, 0.6);
            --border-color: #d1d5db;
            --accent: #3b82f6; /* Blue accent for light mode */
            --accent-hover: #2563eb;
            --shadow: rgba(0, 0, 0, 0.1);
            --thumb-bg: #e5e7eb;
            --thumb-bg-hover: #d1d5db;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Minecraft', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Top Navigation Bar --- */
        header {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow);
            border-bottom: 3px solid var(--accent);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .logo {
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .nav-controls {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        /* --- Sliders (Toggle Switches) --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* --- Content Container --- */
        .content-area {
            width: 95%;
            max-width: 1200px;
            margin-top: 30px;
            flex-grow: 1;
        }

        /* Animation for Views */
        .view-section {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .view-section.active {
            display: block;
        }

        /* --- Games View --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }

        .game-card {
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, background-color 0.4s ease;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--accent);
        }

        .thumbnail {
            width: 100%;
            height: 140px;
            background: var(--thumb-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border-color);
            transition: background 0.3s ease;
        }

        .game-card:hover .thumbnail {
            background: var(--thumb-bg-hover);
        }

        .thumbnail-icon {
            font-size: 3rem;
            color: var(--text-muted);
        }

        .game-title {
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* --- Live Chat View --- */
        #chat-view {
            height: 75vh;
        }

        .chat-container {
            display: flex;
            height: 100%;
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow);
        }

        /* Chat Sidebar */
        .chat-sidebar {
            width: 250px;
            background-color: var(--bg-surface);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .sidebar-header h2 {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
        }

        .create-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .create-btn:hover {
            background-color: var(--accent-hover);
        }

        .group-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
        }

        .group-list li {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .group-list li:hover {
            background-color: var(--thumb-bg);
        }

        .group-list li.active-group {
            border-left: 5px solid var(--accent);
            background-color: var(--thumb-bg);
            font-weight: bold;
        }

        /* Chat Main Area */
        .chat-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
        }

        .chat-header {
            padding: 20px;
            background-color: var(--bg-surface);
            border-bottom: 2px solid var(--border-color);
            font-size: 1.5rem;
        }

        .messages-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            background-color: var(--bg-surface);
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 70%;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .message.own-message {
            align-self: flex-end;
            border-color: var(--accent);
            background-color: var(--thumb-bg);
        }

        .message-author {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .chat-input {
            padding: 20px;
            background-color: var(--bg-surface);
            border-top: 2px solid var(--border-color);
            display: flex;
            gap: 15px;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input input:focus {
            border-color: var(--accent);
        }

        .chat-input button {
            padding: 0 25px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .chat-input button:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LearnMultiply</div>
        <div class="nav-controls">
            
            <!-- Games / Chat Toggle -->
            <div class="toggle-group">
                <span>Games</span>
                <label class="switch">
                    <input type="checkbox" id="view-toggle">
                    <span class="slider"></span>
                </label>
                <span>Live Chat</span>
            </div>

            <!-- Light / Dark Mode Toggle -->
            <div class="toggle-group">
                <span>☀️</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
                <span>🌙</span>
            </div>

        </div>
    </header>

    <main class="content-area">
        
        <!-- ================= GAMES VIEW ================= -->
        <div id="games-view" class="view-section active">
            <div class="games-grid">
                <!-- Game 1 -->
                <a href="#" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">?</span></div>
                    <div class="game-title">Example Game 1</div>
                </a>
                <!-- Game 2 -->
                <a href="#" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">?</span></div>
                    <div class="game-title">Example Game 2</div>
                </a>
                <!-- Game 3 -->
                <a href="#" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">?</span></div>
                    <div class="game-title">Example Game 3</div>
                </a>
            </div>
        </div>

        <!-- ================= LIVE CHAT VIEW ================= -->
        <div id="chat-view" class="view-section">
            <div class="chat-container">
                
                <!-- Groups Sidebar -->
                <div class="chat-sidebar">
                    <div class="sidebar-header">
                        <h2>Groups</h2>
                        <button class="create-btn" onclick="alert('In the future, this will open a modal to name a new group!')">+ New Group</button>
                    </div>
                    <ul class="group-list">
                        <li class="active-group"># Main Hub</li>
                        <li># Math Homework</li>
                        <li># Off-Topic</li>
                    </ul>
                </div>

                <!-- Chat Area -->
                <div class="chat-main">
                    <div class="chat-header">
                        # Main Hub
                    </div>
                    <div class="messages-area">
                        <!-- Example messages -->
                        <div class="message">
                            <div class="message-author">System</div>
                            <div>Welcome to the Main Hub. Be nice!</div>
                        </div>
                        <div class="message own-message">
                            <div class="message-author">You</div>
                            <div>Hey everyone, testing the new chat feature!</div>
                        </div>
                    </div>
                    <div class="chat-input">
                        <input type="text" placeholder="Send a message to # Main Hub...">
                        <button>Send</button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        // --- View Toggling Logic ---
        const viewToggle = document.getElementById('view-toggle');
        const gamesView = document.getElementById('games-view');
        const chatView = document.getElementById('chat-view');

        viewToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                // Switch to Chat
                gamesView.classList.remove('active');
                setTimeout(() => chatView.classList.add('active'), 50); // slight delay for smooth transition
            } else {
                // Switch to Games
                chatView.classList.remove('active');
                setTimeout(() => gamesView.classList.add('active'), 50);
            }
        });

        // --- Theme Toggling Logic ---
        // By default the switch is off (Dark Mode). Checking it turns on Light Mode.
        const themeToggle = document.getElementById('theme-toggle');
        
        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.remove('light-mode'); // Assuming Moon = checked = Dark Mode
            } else {
                document.body.classList.add('light-mode');    // Assuming Sun = unchecked = Light Mode
            }
        });

        // Set default state for the theme toggle (we start in Dark mode, so check the moon box)
        themeToggle.checked = true; 
    </script>

</body>
</html>
