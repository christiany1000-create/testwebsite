<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Arcade | Unblocked Games</title>
    <style>
        /* CSS Variables for easy theme changing */
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Navigation Bar */
        header {
            background-color: var(--surface);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .search-bar {
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            border: 1px solid #334155;
            background-color: var(--bg);
            color: var(--text);
            width: 100%;
            max-width: 350px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        /* Main Content Grid */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .container h2 {
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        /* Game Cards */
        .card {
            background-color: var(--surface);
            border-radius: 0.75rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 3px solid var(--primary);
        }

        .card-content {
            padding: 1.2rem;
        }

        .card-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
        }

        .card-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
        }

        /* Fullscreen Game Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-bottom: 1px solid #334155;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            .search-bar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🎮 Nova Arcade</a>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search games...">
    </header>

    <div class="container">
        <h2>Popular Games</h2>
        <div class="grid" id="gameGrid">
            <!-- Games will be injected here by JavaScript -->
        </div>
    </div>

    <!-- Game Player Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin: 0;">Game Title</h3>
            <button class="close-btn" onclick="closeGame()">Exit Game</button>
        </div>
        <div class="iframe-container">
            <iframe id="gameIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="pointer-lock; fullscreen; autoplay; keyboard-map; clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <script>
        // Game Database
        const games = [
            {
                title: "Craft",
                category: "Adventure",
                image: "https://placehold.co/400x250/059669/ffffff?text=Craft", 
                url: "craft.html" // Points to your local file on GitHub Pages
            },
            {
                title: "2048",
                category: "Puzzle",
                image: "https://placehold.co/400x250/2563eb/ffffff?text=2048",
                url: "https://play2048.co/"
            },
            {
                title: "Flappy Bird Clone",
                category: "Arcade",
                image: "https://placehold.co/400x250/16a34a/ffffff?text=Flappy+Bird",
                url: "https://flappybird.io/"
            },
            {
                title: "Pac-Man",
                category: "Classic",
                image: "https://placehold.co/400x250/eab308/000000?text=Pac-Man",
                url: "https://freepacman.org/"
            },
            {
                title: "Tetris Clone",
                category: "Puzzle",
                image: "https://placehold.co/400x250/8b5cf6/ffffff?text=Tetris",
                url: "https://tetris.com/play-tetris"
            },
            {
                title: "Doodle Jump",
                category: "Arcade",
                image: "https://placehold.co/400x250/ec4899/ffffff?text=Doodle+Jump",
                url: "https://poki.com/en/g/doodle-jump"
            },
            {
                title: "Chess",
                category: "Strategy",
                image: "https://placehold.co/400x250/52525b/ffffff?text=Chess",
                url: "https://www.chess.com/play/computer"
            }
        ];

        // DOM Elements
        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('gameModal');
        const iframe = document.getElementById('gameIframe');
        const modalTitle = document.getElementById('modalTitle');

        // Function to render games to the grid
        function renderGames(gameList) {
            grid.innerHTML = ''; // Clear current grid
            
            if (gameList.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">No games found.</p>';
                return;
            }

            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openGame(game);
                
                card.innerHTML = `
                    <img src="${game.image}" alt="${game.title}">
                    <div class="card-content">
                        <h3 class="card-title">${game.title}</h3>
                        <span class="card-category">${game.category}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Function to open the game in the fullscreen modal
        function openGame(game) {
            modalTitle.textContent = game.title;
            iframe.src = game.url;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        // Function to close the game
        function closeGame() {
            modal.style.display = 'none';
            iframe.src = ''; // Clear the iframe source so audio stops playing
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        // Search filtering logic
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(term) || 
                game.category.toLowerCase().includes(term)
            );
            renderGames(filteredGames);
        });

        // Initialize the page by rendering all games
        renderGames(games);
    </script>
</body>
</html>
