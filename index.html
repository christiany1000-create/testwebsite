<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML5 Mobile Shorts Client</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #000; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }
        .feed { 
            height: 100vh; overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .short-container { 
            height: 100vh; width: 100vw; 
            position: relative; 
            scroll-snap-align: start; 
            display: flex; justify-content: center; align-items: center; 
            background: #111;
        }
        .video-player { 
            width: 100%; height: 100%; 
            border: none; pointer-events: auto;
        }
        .overlay-actions { 
            position: absolute; bottom: 80px; right: 10px; 
            display: flex; flex-direction: column; gap: 20px; 
            align-items: center; z-index: 10; 
        }
        .info-panel { 
            position: absolute; bottom: 30px; left: 15px; 
            z-index: 10; max-width: 75%; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .info-panel h3 { margin: 0 0 5px 0; font-size: 1.1rem; cursor: pointer; }
        .info-panel p { margin: 0; font-size: 0.9rem; line-height: 1.3; }
        .action-btn { 
            background: rgba(0,0,0,0.6); border: none; color: white; 
            border-radius: 50%; width: 50px; height: 50px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 22px; backdrop-filter: blur(4px);
        }
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        .auth-btn { 
            background: #ff0000; color: #fff; border: none; 
            padding: 8px 16px; border-radius: 20px; 
            font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .status { font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        
        /* Modal for Channel View */
        .modal {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            z-index: 200; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #222; padding: 20px; border-radius: 12px;
            text-align: center; width: 80%; max-width: 300px;
        }
        .modal-content h2 { margin-top: 0; }
        .close-btn {
            background: #444; color: white; border: none;
            padding: 8px 16px; border-radius: 8px; margin-top: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="status" id="auth-status">Not Signed In</div>
        <button id="auth-btn" class="auth-btn" onclick="handleAuthClick()">Sign In</button>
    </div>

    <div class="feed" id="feed">
        <!-- Videos injected dynamically -->
    </div>

    <!-- Channel Info Modal -->
    <div class="modal" id="channel-modal">
        <div class="modal-content">
            <h2 id="modal-title">Channel Name</h2>
            <p>Subscribers: <span id="modal-subs">0</span></p>
            <p>Total Views: <span id="modal-views">0</span></p>
            <p>Videos: <span id="modal-videos">0</span></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- Google Identity Services and Google API Client Library -->
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>

    <script>
        // === CONFIGURATION ===
        // Replace these with your actual credentials from Google Cloud Console
        const CLIENT_ID = '787259726635-ldace8nm63t3ehiog8189pekts6138dc.apps.googleusercontent.com'; 
        const API_KEY = 'AIzaSyDw9lwxRVpxFOMAAsd8dotB4Nf1aiuyOBE';
        const DISCOVERY_DOCS = ['https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest'];
        const SCOPES = 'https://www.googleapis.com/auth/youtube.force-ssl';

        let tokenClient;
        let isAuthenticated = false;

        // Initialize Google API Client
        async function gapiLoaded() {
            await gapi.load('client', async () => {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: DISCOVERY_DOCS,
                });
                loadShorts(); // Load initial videos without auth
            });
        }

        // Initialize Google Identity Services
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        isAuthenticated = true;
                        document.getElementById('auth-btn').innerText = 'Sign Out';
                        document.getElementById('auth-btn').onclick = handleSignoutClick;
                        document.getElementById('auth-status').innerText = 'Signed In';
                    }
                },
            });
        }

        function handleAuthClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    isAuthenticated = false;
                    document.getElementById('auth-btn').innerText = 'Sign In';
                    document.getElementById('auth-btn').onclick = handleAuthClick;
                    document.getElementById('auth-status').innerText = 'Not Signed In';
                });
            }
        }

        // Fetch YouTube Shorts
        async function loadShorts() {
            try {
                const response = await gapi.client.youtube.search.list({
                    part: 'snippet',
                    q: '#shorts',
                    maxResults: 10,
                    type: 'video',
                    videoDuration: 'short',
                    videoEmbeddable: 'true' // Filters out videos that disable embedding
                });

                const feed = document.getElementById('feed');
                feed.innerHTML = ''; 

                response.result.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const channelId = item.snippet.channelId;
                    const title = item.snippet.title;
                    const channelTitle = item.snippet.channelTitle;

                    const shortHtml = `
                        <div class="short-container">
                            <iframe class="video-player" 
                                src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=0&loop=1&controls=0&modestbranding=1&rel=0&playsinline=1&origin=${window.location.origin}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                            <div class="info-panel">
                                <h3 onclick="viewChannel('${channelId}')">@${channelTitle}</h3>
                                <p>${title}</p>
                            </div>
                            <div class="overlay-actions">
                                <button class="action-btn" onclick="likeVideo('${videoId}')" title="Like">👍</button>
                                <button class="action-btn" onclick="commentVideo('${videoId}')" title="Comment">💬</button>
                                <button class="action-btn" onclick="subscribeChannel('${channelId}')" title="Subscribe">➕</button>
                            </div>
                        </div>
                    `;
                    feed.insertAdjacentHTML('beforeend', shortHtml);
                });
            } catch (err) {
                console.error('Error loading shorts', err);
                document.getElementById('feed').innerHTML = '<div style="margin: 100px; text-align: center;">Error loading videos. Check API Key.</div>';
            }
        }

        async function likeVideo(videoId) {
            if (!isAuthenticated) return alert('Please sign in to like videos');
            try {
                await gapi.client.youtube.videos.rate({
                    id: videoId,
                    rating: 'like'
                });
                alert('Video liked!');
            } catch (err) {
                console.error('Like error:', err);
                alert('Error liking video. Ensure your app has proper permissions.');
            }
        }

        async function commentVideo(videoId) {
            if (!isAuthenticated) return alert('Please sign in to comment');
            const text = prompt('Enter your comment:');
            if (!text) return;
            try {
                await gapi.client.youtube.commentThreads.insert({
                    part: 'snippet',
                    resource: {
                        snippet: {
                            videoId: videoId,
                            topLevelComment: {
                                snippet: { textOriginal: text }
                            }
                        }
                    }
                });
                alert('Comment posted successfully!');
            } catch (err) {
                console.error('Comment error:', err);
                alert('Error posting comment.');
            }
        }

        async function subscribeChannel(channelId) {
            if (!isAuthenticated) return alert('Please sign in to subscribe');
            try {
                await gapi.client.youtube.subscriptions.insert({
                    part: 'snippet',
                    resource: {
                        snippet: {
                            resourceId: {
                                kind: 'youtube#channel',
                                channelId: channelId
                            }
                        }
                    }
                });
                alert('Subscribed to channel!');
            } catch (err) {
                console.error('Subscribe error:', err);
                alert('Error subscribing or already subscribed.');
            }
        }

        async function viewChannel(channelId) {
            try {
                const response = await gapi.client.youtube.channels.list({
                    part: 'snippet,statistics',
                    id: channelId
                });
                const channel = response.result.items[0];
                
                document.getElementById('modal-title').innerText = channel.snippet.title;
                document.getElementById('modal-subs').innerText = Number(channel.statistics.subscriberCount).toLocaleString();
                document.getElementById('modal-views').innerText = Number(channel.statistics.viewCount).toLocaleString();
                document.getElementById('modal-videos').innerText = Number(channel.statistics.videoCount).toLocaleString();
                
                document.getElementById('channel-modal').style.display = 'flex';
            } catch (err) {
                console.error('Channel info error:', err);
                alert('Could not load channel info.');
            }
        }

        function closeModal() {
            document.getElementById('channel-modal').style.display = 'none';
        }
    </script>
</body>
</html>
