<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnMultiply</title>
    
    <link rel="icon" type="image/png" href="assets/sitelogo.png">

    <style>
        /* --- Font Setup --- */
        @font-face {
            font-family: 'Minecraft';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- CSS Variables for Light/Dark Mode --- */
        :root {
            --bg-base: #121212;
            --bg-surface: #1e1e2f;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: #2a2a40;
            --accent: #FF5722; 
            --accent-gradient: linear-gradient(135deg, #FF3D00, #FFCA28); 
            --accent-hover: linear-gradient(135deg, #DD2C00, #FF9800);
            --shadow: rgba(0, 0, 0, 0.6);
            --thumb-bg: #2c2c44;
            --thumb-bg-hover: #3a3a5c;
        }

        .light-mode {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --text-main: #1c1e21;
            --text-muted: rgba(0, 0, 0, 0.6);
            --border-color: #d1d5db;
            --shadow: rgba(0, 0, 0, 0.1);
            --thumb-bg: #e5e7eb;
            --thumb-bg-hover: #d1d5db;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Minecraft', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Header --- */
        header {
            width: 100%;
            background-color: var(--bg-surface);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow);
            border-bottom: 3px solid var(--accent);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            height: 40px;
            width: auto;
        }

        .logo {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Navigation Tabs --- */
        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent);
        }

        .nav-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- Sliders (Moved to Settings) --- */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--accent-gradient); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* --- Layout --- */
        .content-area { width: 95%; max-width: 1200px; margin-top: 30px; margin-bottom: 60px; flex-grow: 1; }
        .view-section { display: none; animation: fadeIn 0.5s ease forwards; }
        .view-section.active { display: block; }

        /* --- Settings View --- */
        .settings-container {
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .settings-container h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem;
        }

        .color-picker {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            height: 35px;
            width: 60px;
            cursor: pointer;
            background: var(--bg-base);
        }

        /* --- Games View --- */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        
        .game-card { 
            background-color: var(--bg-surface); 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            cursor: pointer; 
            text-decoration: none; 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; 
            position: relative; 
        }
        
        .game-card:hover { 
            transform: translateY(-12px) scale(1.03); 
            box-shadow: 0 15px 25px rgba(255, 87, 34, 0.2); 
            border-color: var(--accent); 
            z-index: 10; 
        }
        
        .thumbnail { 
            width: 100%; 
            height: 140px; 
            background: var(--thumb-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 2px solid var(--border-color); 
            transition: background 0.3s; 
            position: relative;
            z-index: 2; 
            border-radius: 10px 10px 0 0; 
            overflow: hidden;
        }
        
        .game-card:hover .thumbnail { background: var(--thumb-bg-hover); }
        .thumbnail-icon { font-size: 3rem; color: var(--text-muted); }
        
        .game-title { 
            padding: 15px; 
            text-align: center; 
            font-size: 1.2rem; 
            background-color: var(--bg-surface); 
            position: relative;
            z-index: 2; 
            border-radius: 0 0 10px 10px; 
        }

        .play-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--accent-gradient);
            color: white;
            text-align: center;
            padding: 10px 0;
            border-radius: 0 0 10px 10px;
            font-size: 1.1rem;
            z-index: 1; 
            transform: translateY(0); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        .game-card:hover .play-btn { transform: translateY(100%); }

        /* --- Live Chat View --- */
        #chat-view { height: 75vh; }
        .chat-container { display: flex; height: 100%; background-color: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px var(--shadow); position: relative; }
        
        #auth-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; text-align: center;}
        #login-btn { padding: 15px 30px; font-size: 1.2rem; background: var(--accent-gradient); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; margin-top: 20px; transition: opacity 0.2s; }
        #login-btn:hover { opacity: 0.9; }

        .chat-sidebar { width: 250px; background-color: var(--bg-surface); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 2px solid var(--border-color); }
        .sidebar-header h2 { margin: 0 0 15px 0; font-size: 1.5rem; }
        .create-btn { width: 100%; padding: 10px; background: var(--accent-gradient); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .create-btn:hover { opacity: 0.9; }
        
        .group-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .group-list li { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
        .group-list li:hover { background-color: var(--thumb-bg); }
        .group-list li.active-group { border-left: 5px solid var(--accent); background-color: var(--thumb-bg); font-weight: bold; }

        .chat-main { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-base); }
        .chat-header { padding: 20px; background-color: var(--bg-surface); border-bottom: 2px solid var(--border-color); font-size: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        
        .messages-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { background-color: var(--bg-surface); padding: 12px 15px; border-radius: 8px; max-width: 70%; align-self: flex-start; border: 1px solid var(--border-color); word-wrap: break-word;}
        .message.own-message { align-self: flex-end; border-color: var(--accent); background-color: var(--thumb-bg); }
        .message-author { font-size: 0.9rem; color: var(--accent); margin-bottom: 5px; }
        
        .chat-input { padding: 20px; background-color: var(--bg-surface); border-top: 2px solid var(--border-color); display: flex; gap: 15px; }
        .chat-input input { flex-grow: 1; padding: 12px 15px; border-radius: 6px; border: 2px solid var(--border-color); background-color: var(--bg-base); color: var(--text-main); font-family: inherit; font-size: 1rem; outline: none; }
        .chat-input input:focus { border-color: var(--accent); }
        .chat-input button { padding: 0 25px; background: var(--accent-gradient); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s; }
        .chat-input button:active { transform: scale(0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="assets/sitelogo.png" alt="Logo" class="logo-icon">
            <div class="logo">LearnMultiply</div>
        </div>
        
        <!-- NEW NAVIGATION TABS -->
        <div class="nav-controls">
            <button class="nav-btn active" data-target="games-view">🎮 Games</button>
            <button class="nav-btn" data-target="chat-view">💬 Chat</button>
            <button class="nav-btn" data-target="settings-view">⚙️ Settings</button>
        </div>
    </header>

    <main class="content-area">
        
        <!-- === GAMES VIEW === -->
        <div id="games-view" class="view-section active">
            <div class="games-grid">
                
                <a href="craft.html" class="game-card">
                    <div class="thumbnail">
                        <img src="assets/mclogo.webp" alt="Eaglercraft" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="game-title">Eaglercraft</div>
                    <div class="play-btn">▶ Play Now</div>
                </a>

                <a href="#" class="game-card">
                    <div class="thumbnail"><span class="thumbnail-icon">?</span></div>
                    <div class="game-title">Example Game 2</div>
                    <div class="play-btn">▶ Play Now</div>
                </a>

            </div>
        </div>

        <!-- === LIVE CHAT VIEW === -->
        <div id="chat-view" class="view-section">
            <div class="chat-container">
                
                <div id="auth-overlay">
                    <h2>Classroom Chat</h2>
                    <p>Please sign in with your Google account to chat.</p>
                    <button id="login-btn">Sign in with Google</button>
                </div>

                <div class="chat-sidebar">
                    <div class="sidebar-header">
                        <h2>Groups</h2>
                        <button id="create-group-btn" class="create-btn">+ New Group</button>
                    </div>
                    <ul class="group-list" id="sidebar-groups">
                        <!-- Groups load dynamically here -->
                    </ul>
                </div>

                <div class="chat-main">
                    <div class="chat-header">
                        <span id="current-group-title"># Select a Group</span>
                        <button id="logout-btn" style="display:none;">Log Out</button>
                    </div>
                    <div class="messages-area" id="messages-container"></div>
                    <div class="chat-input">
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled>
                        <button id="send-btn" disabled>Send</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- === SETTINGS VIEW === -->
        <div id="settings-view" class="view-section">
            <div class="settings-container">
                <h2>Customization</h2>
                
                <div class="setting-item">
                    <span>Dark Mode</span>
                    <label class="switch"><input type="checkbox" id="theme-toggle" checked><span class="slider"></span></label>
                </div>

                <div class="setting-item">
                    <span>Gradient Color 1</span>
                    <input type="color" id="color1" class="color-picker" value="#FF3D00">
                </div>

                <div class="setting-item">
                    <span>Gradient Color 2</span>
                    <input type="color" id="color2" class="color-picker" value="#FFCA28">
                </div>
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- FRONTEND JAVASCRIPT (Navigation & Settings)-->
    <!-- ========================================== -->
    <script>
        // --- Navigation Logic ---
        const navBtns = document.querySelectorAll('.nav-btn');
        const viewSections = document.querySelectorAll('.view-section');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons and views
                navBtns.forEach(b => b.classList.remove('active'));
                viewSections.forEach(v => v.classList.remove('active'));
                
                // Add active class to clicked button and target view
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // --- Settings Logic ---
        const themeToggle = document.getElementById('theme-toggle');
        const color1Input = document.getElementById('color1');
        const color2Input = document.getElementById('color2');
        const root = document.documentElement;

        // Apply saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.checked = false;
        }

        // Apply saved colors
        const savedC1 = localStorage.getItem('gradC1');
        const savedC2 = localStorage.getItem('gradC2');
        if (savedC1 && savedC2) {
            color1Input.value = savedC1;
            color2Input.value = savedC2;
            applyColors(savedC1, savedC2);
        }

        // Theme Toggle Event
        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            }
        });

        // Color Change Events
        function applyColors(c1, c2) {
            root.style.setProperty('--accent', c1);
            root.style.setProperty('--accent-gradient', `linear-gradient(135deg, ${c1}, ${c2})`);
            root.style.setProperty('--accent-hover', `linear-gradient(135deg, ${c1}, ${c1})`);
        }

        color1Input.addEventListener('input', (e) => {
            applyColors(e.target.value, color2Input.value);
            localStorage.setItem('gradC1', e.target.value);
        });

        color2Input.addEventListener('input', (e) => {
            applyColors(color1Input.value, e.target.value);
            localStorage.setItem('gradC2', e.target.value);
        });
    </script>

    <!-- ========================================== -->
    <!-- FIREBASE JAVASCRIPT (Backend logic)        -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, setDoc, doc, serverTimestamp, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATd0AhKa4v8rS4viCXETkjZ16V6e1VjsY",
            authDomain: "learnmultiply.firebaseapp.com",
            projectId: "learnmultiply",
            storageBucket: "learnmultiply.firebasestorage.app",
            messagingSenderId: "328977544347",
            appId: "1:328977544347:web:1330f41590b4805854423e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const authOverlay = document.getElementById('auth-overlay');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sidebarGroups = document.getElementById('sidebar-groups');
        const createGroupBtn = document.getElementById('create-group-btn');
        const currentGroupTitle = document.getElementById('current-group-title');

        let currentUser = null;
        let activeGroupId = null;
        let unsubscribeMessages = null;

        // --- AUTHENTICATION ---
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error(err));
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authOverlay.style.display = 'none';
                logoutBtn.style.display = 'block';
                loadGroups(); // Start loading groups once logged in
            } else {
                currentUser = null;
                activeGroupId = null;
                authOverlay.style.display = 'flex';
                logoutBtn.style.display = 'none';
                messagesContainer.innerHTML = '';
                sidebarGroups.innerHTML = '';
                if(unsubscribeMessages) unsubscribeMessages();
            }
        });

        // --- GROUP LOGIC ---
        
        // Create a new group
        createGroupBtn.addEventListener('click', async () => {
            const groupName = prompt("Enter the name of the new group:");
            if (groupName && groupName.trim()) {
                // Create a unique ID for the group (e.g. "math_homework_12345")
                const groupId = groupName.trim().toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now();
                
                await setDoc(doc(db, "groups", groupId), {
                    name: groupName.trim(),
                    createdAt: serverTimestamp()
                });
            }
        });

        // Load all groups into the sidebar
        function loadGroups() {
            const q = query(collection(db, "groups"), orderBy("createdAt", "asc"));
            
            onSnapshot(q, async (snapshot) => {
                sidebarGroups.innerHTML = '';
                
                // If database is completely empty, auto-create a Main Hub
                if (snapshot.empty) {
                    await setDoc(doc(db, "groups", "main_hub"), { name: "Main Hub", createdAt: serverTimestamp() });
                    return;
                }

                snapshot.forEach((groupDoc) => {
                    const group = groupDoc.data();
                    const li = document.createElement('li');
                    li.textContent = `# ${group.name}`;
                    
                    if (activeGroupId === groupDoc.id) {
                        li.classList.add('active-group');
                    }

                    li.addEventListener('click', () => {
                        // Switch active class visually
                        document.querySelectorAll('.group-list li').forEach(el => el.classList.remove('active-group'));
                        li.classList.add('active-group');
                        
                        // Load messages for this specific group
                        switchGroup(groupDoc.id, group.name);
                    });

                    sidebarGroups.appendChild(li);
                });

                // Auto-join the first group if we haven't joined one yet
                if (!activeGroupId && !snapshot.empty) {
                    const firstGroup = snapshot.docs[0];
                    switchGroup(firstGroup.id, firstGroup.data().name);
                    sidebarGroups.firstChild.classList.add('active-group');
                }
            });
        }

        // --- MESSAGING LOGIC ---

        function switchGroup(groupId, groupName) {
            activeGroupId = groupId;
            currentGroupTitle.textContent = `# ${groupName}`;
            
            // Enable inputs
            messageInput.disabled = false;
            sendBtn.disabled = false;

            // Stop listening to old group's messages
            if (unsubscribeMessages) unsubscribeMessages();

            // Start listening to new group's messages (subcollection inside the group)
            const q = query(collection(db, "groups", groupId, "messages"), orderBy("createdAt", "asc"), limit(50));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                
                snapshot.forEach((msgDoc) => {
                    const message = msgDoc.data();
                    const isOwnMessage = message.uid === currentUser.uid;
                    
                    const msgElement = document.createElement('div');
                    msgElement.classList.add('message');
                    if (isOwnMessage) msgElement.classList.add('own-message');
                    
                    msgElement.innerHTML = `
                        <div class="message-author">${isOwnMessage ? 'You' : message.author}</div>
                        <div>${message.text}</div>
                    `;
                    messagesContainer.appendChild(msgElement);
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Send a message to the currently active group
        const sendMessage = async () => {
            const text = messageInput.value.trim();
            if (text === "" || !currentUser || !activeGroupId) return;
            
            messageInput.value = '';
            
            try {
                await addDoc(collection(db, "groups", activeGroupId, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    author: currentUser.displayName,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error writing message: ", error);
            }
        };

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
