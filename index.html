<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raidingdud | Developer Menu</title>
    <style>
        /* Loads the Minecraft font */
        @font-face {
            font-family: 'MinecraftFont';
            src: url('minecraft.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* OLED Black Background */
        body {
            background-color: #000000;
            color: #AAAAAA; /* Secondary Light Gray */
            font-family: 'MinecraftFont', monospace, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        /* Main Menu Container */
        .menu-container {
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -50px;
        }

        /* Logo Area */
        .logo-container {
            position: relative;
            margin-bottom: 60px;
            text-align: center;
        }

        .logo {
            font-size: 4.5rem;
            color: #3388FF; /* Primary Blue */
            text-shadow: 4px 4px 0px #001133;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Yellow Splashtext -> Now Light Gray */
        .splash {
            position: absolute;
            bottom: -20px;
            right: -40px;
            color: #AAAAAA; /* Secondary Light Gray */
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #111111;
            transform: rotate(-20deg);
            animation: splashThrob 0.4s infinite alternate;
            white-space: nowrap;
        }

        @keyframes splashThrob {
            from { transform: rotate(-20deg) scale(1); }
            to { transform: rotate(-20deg) scale(1.1); }
        }

        /* Button Layout */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        /* OLED MC Buttons */
        .mc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000; /* Pitch black for OLED */
            border: 2px solid #111111;
            /* Subtle gray 3D bevel to keep the MC shape on a black background */
            box-shadow: inset 2px 2px 0px 0px #333333, inset -2px -2px 0px 0px #0a0a0a;
            color: #AAAAAA; /* Secondary Light Gray */
            text-shadow: 2px 2px 0px #000000;
            font-family: 'MinecraftFont', monospace;
            font-size: 1.2rem;
            text-decoration: none;
            height: 40px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.1s ease-in-out;
        }

        /* Half-width buttons */
        .mc-btn.half {
            width: 48%; 
        }

        /* Hover Effect (Turns Primary Blue) */
        .mc-btn:hover {
            color: #3388FF; /* Primary Blue */
            border-color: #3388FF; /* Outlines the button in blue */
            /* Blue glowing 3D bevel */
            box-shadow: inset 2px 2px 0px 0px #55AAFF, inset -2px -2px 0px 0px #0044AA;
        }

        /* Footer Text Overlay */
        .footer-left {
            position: fixed;
            bottom: 5px;
            left: 5px;
            color: #AAAAAA; /* Secondary Light Gray */
            text-shadow: 2px 2px 0px #000000;
            font-size: 1rem;
        }

        .footer-right {
            position: fixed;
            bottom: 5px;
            right: 5px;
            color: #AAAAAA; /* Secondary Light Gray */
            text-shadow: 2px 2px 0px #000000;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        
        <!-- Title & Splash Text -->
        <div class="logo-container">
            <h1 class="logo">Raidingdud</h1>
            <div class="splash">Developer Edition!</div>
        </div>

        <!-- Classic Menu Buttons -->
        <div class="button-group">
            <a href="#" class="mc-btn">My Projects & Mods</a>
            <a href="#" class="mc-btn">GitHub Profile</a>
            <a href="#" class="mc-btn">Discord Server</a>
            
            <div class="button-row">
                <a href="#" class="mc-btn half">About Me</a>
                <a href="#" class="mc-btn half">Contact</a>
            </div>
        </div>

    </div>

    <div class="footer-left">Raidingdud Web v1.0</div>
    <div class="footer-right">Copyright DOC. Do not distribute!</div>

</body>
</html>
