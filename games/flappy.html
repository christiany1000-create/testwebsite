<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird HTML5</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Container maintaining 9:16 aspect ratio on Desktop & Mobile */
    #game-container {
      position: relative;
      height: 92vh;
      aspect-ratio: 9 / 16;
      max-width: 95vw;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #70c5ce;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: #f59e0b;
      text-shadow: 3px 3px 0px #000;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      color: #fff;
      margin-bottom: 5px;
    }

    .btn {
      background-color: #ea580c;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 0 #9a3412;
      transition: transform 0.1s, background-color 0.2s;
      width: 80%;
      max-width: 220px;
    }

    .btn:hover {
      background-color: #f97316;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9a3412;
    }

    .score-badge {
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 220px;
      display: flex;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 80%;
      max-width: 220px;
    }

    input[type="text"] {
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #ea580c;
      background: #1e293b;
      color: white;
      text-align: center;
      font-size: 1rem;
      outline: none;
    }

    .leaderboard-table {
      width: 90%;
      max-width: 280px;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px;
      text-align: left;
      font-size: 0.95rem;
    }

    .leaderboard-table th {
      border-bottom: 2px solid #f59e0b;
      color: #f59e0b;
    }

    .leaderboard-table td:last-child {
      text-align: right;
      font-weight: bold;
    }

    .leaderboard-empty {
      color: #94a3b8;
      font-style: italic;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Fixed internal virtual resolution (360x640) for 100% consistent physics across all devices -->
    <canvas id="canvas" width="360" height="640"></canvas>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
      <h1>FLAPPY BIRD</h1>
      <button class="btn" onclick="startGame()">PLAY</button>
      <button class="btn" onclick="showLeaderboard()">LEADERBOARD</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay hidden">
      <h1>GAME OVER</h1>
      
      <div class="score-badge">
        <span>Score:</span>
        <span id="final-score">0</span>
      </div>
      <div class="score-badge">
        <span>Best:</span>
        <span id="best-score">0</span>
      </div>

      <div id="save-score-section" class="input-group">
        <input type="text" id="player-name" placeholder="Enter Name" maxlength="10">
        <button class="btn" onclick="submitScore()">SAVE SCORE</button>
      </div>

      <button class="btn" onclick="startGame()">RETRY</button>
      <button class="btn" onclick="showMenu()">MENU</button>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="overlay hidden">
      <h2>HIGH SCORES</h2>
      <table class="leaderboard-table" id="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th style="text-align: right;">Score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <div id="no-scores" class="leaderboard-empty hidden">No scores saved yet!</div>
      <button class="btn" onclick="showMenu()">BACK</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const mainMenu = document.getElementById('main-menu');
    const gameOverMenu = document.getElementById('game-over');
    const leaderboardScreen = document.getElementById('leaderboard-screen');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const playerNameInput = document.getElementById('player-name');
    const saveScoreSection = document.getElementById('save-score-section');
    const leaderboardBody = document.getElementById('leaderboard-body');
    const noScoresEl = document.getElementById('no-scores');

    // Game Variables
    let state = 'MENU';
    let score = 0;
    let lastTime = 0;
    let pipeSpawnTimer = 0;
    const groundHeight = 50;

    // --- FLOATY PHYSICS CONFIGURATION ---
    const bird = {
      x: 80,
      y: 280,
      radius: 13,
      velocity: 0,
      gravity: 0.115,  // Very light gravity pull
      jump: -3.8,      // Smooth, floaty hop
      rotation: 0,

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Body
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(4, -4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(5, -4, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.arc(6, 2, 5, 0, Math.PI);
        ctx.fill();

        ctx.restore();
      },

      flap() {
        this.velocity = this.jump;
      },

      update(dt) {
        this.velocity += this.gravity * dt;
        this.y += this.velocity * dt;

        // Angle Rotation based on speed
        if (this.velocity < 0) {
          this.rotation = -0.25;
        } else {
          this.rotation = Math.min(Math.PI / 2, this.rotation + 0.035 * dt);
        }

        // Floor Collision
        if (this.y + this.radius >= canvas.height - groundHeight) {
          this.y = canvas.height - groundHeight - this.radius;
          endGame();
        }

        // Ceiling Collision
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },

      reset() {
        this.y = 280;
        this.velocity = 0;
        this.rotation = 0;
      }
    };

    // Pipes Manager
    const pipes = {
      items: [],
      width: 52,
      gap: 135,       // Generous gap for comfortable navigation
      speed: 1.6,     // Relaxed scroll speed

      draw() {
        for (let p of this.items) {
          ctx.fillStyle = '#22c55e';
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 2;

          // Top Pipe
          ctx.fillRect(p.x, 0, this.width, p.top);
          ctx.strokeRect(p.x, 0, this.width, p.top);

          // Bottom Pipe
          ctx.fillRect(p.x, p.bottom, this.width, canvas.height - groundHeight - p.bottom);
          ctx.strokeRect(p.x, p.bottom, this.width, canvas.height - groundHeight - p.bottom);
        }
      },

      update(dt) {
        pipeSpawnTimer += dt;
        if (pipeSpawnTimer >= 115) {
          pipeSpawnTimer = 0;
          const minTop = 40;
          const maxTop = canvas.height - groundHeight - this.gap - 40;
          const top = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
          const bottom = top + this.gap;

          this.items.push({
            x: canvas.width,
            top: top,
            bottom: bottom,
            passed: false
          });
        }

        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= this.speed * dt;

          // Collision Detection
          if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + this.width &&
            (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
          ) {
            endGame();
          }

          // Score Increment
          if (p.x + this.width < bird.x && !p.passed) {
            score++;
            p.passed = true;
          }

          // Remove Offscreen Pipes
          if (p.x + this.width < 0) {
            this.items.splice(i, 1);
            i--;
          }
        }
      },

      reset() {
        this.items = [];
        pipeSpawnTimer = 0;
      }
    };

    function drawGround() {
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 12);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - groundHeight);
      ctx.lineTo(canvas.width, canvas.height - groundHeight);
      ctx.stroke();
    }

    function drawScore() {
      if (state === 'PLAYING') {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      }
    }

    // Delta-Time Frame Normalization Loop (Fixes 60Hz / 144Hz differences)
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 16.666, 2.5);
      lastTime = timestamp;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (state === 'PLAYING') {
        bird.update(dt);
        pipes.update(dt);
      }

      pipes.draw();
      drawGround();
      bird.draw();
      drawScore();

      requestAnimationFrame(gameLoop);
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'PLAYING') {
        e.preventDefault();
        bird.flap();
      }
    });

    canvas.addEventListener('click', () => {
      if (state === 'PLAYING') {
        bird.flap();
      }
    });

    window.addEventListener('touchstart', (e) => {
      if (state === 'PLAYING' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
        bird.flap();
      }
    }, { passive: true });

    // Menu Navigation
    function showMenu() {
      state = 'MENU';
      hideOverlays();
      mainMenu.classList.remove('hidden');
      resetGameObjects();
    }

    function startGame() {
      state = 'PLAYING';
      hideOverlays();
      resetGameObjects();
    }

    function endGame() {
      state = 'GAMEOVER';
      finalScoreEl.textContent = score;

      const leaderboard = getLeaderboard();
      const best = leaderboard.length > 0 ? leaderboard[0].score : 0;
      bestScoreEl.textContent = Math.max(best, score);

      saveScoreSection.classList.remove('hidden');
      playerNameInput.value = '';

      gameOverMenu.classList.remove('hidden');
    }

    function showLeaderboard() {
      state = 'LEADERBOARD';
      hideOverlays();
      leaderboardScreen.classList.remove('hidden');
      renderLeaderboard();
    }

    function hideOverlays() {
      mainMenu.classList.add('hidden');
      gameOverMenu.classList.add('hidden');
      leaderboardScreen.classList.add('hidden');
    }

    function resetGameObjects() {
      bird.reset();
      pipes.reset();
      score = 0;
    }

    // Local Storage Leaderboard
    function getLeaderboard() {
      const data = localStorage.getItem('flappy_leaderboard');
      return data ? JSON.parse(data) : [];
    }

    function submitScore() {
      const name = playerNameInput.value.trim() || 'Anonymous';
      const leaderboard = getLeaderboard();

      leaderboard.push({ name, score });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard.splice(10);

      localStorage.setItem('flappy_leaderboard', JSON.stringify(leaderboard));
      saveScoreSection.classList.add('hidden');
      showLeaderboard();
    }

    function renderLeaderboard() {
      const leaderboard = getLeaderboard();
      leaderboardBody.innerHTML = '';

      if (leaderboard.length === 0) {
        noScoresEl.classList.remove('hidden');
        document.getElementById('leaderboard-table').classList.add('hidden');
      } else {
        noScoresEl.classList.add('hidden');
        document.getElementById('leaderboard-table').classList.remove('hidden');

        leaderboard.forEach((entry, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(entry.name)}</td>
            <td>${entry.score}</td>
          `;
          leaderboardBody.appendChild(row);
        });
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Run Engine
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
