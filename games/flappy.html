<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird HTML5 - Fullscreen Desktop & Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #70c5ce;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #f4c430;
      text-shadow: 3px 3px #000;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #fff;
      margin-bottom: 10px;
    }

    .btn {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d35400;
      transition: transform 0.1s, background-color 0.2s;
      width: 90%;
      max-width: 260px;
    }

    .btn:hover {
      background-color: #f39c12;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d35400;
    }

    .score-badge {
      font-size: 1.2rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 260px;
      display: flex;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 90%;
      max-width: 260px;
    }

    input[type="text"] {
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #e67e22;
      background: #2c3e50;
      color: white;
      text-align: center;
      font-size: 1.1rem;
      outline: none;
    }

    .leaderboard-table {
      width: 90%;
      max-width: 340px;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 10px;
      text-align: left;
      font-size: 1.05rem;
    }

    .leaderboard-table th {
      border-bottom: 2px solid #f4c430;
      color: #f4c430;
    }

    .leaderboard-table td:last-child {
      text-align: right;
      font-weight: bold;
    }

    .leaderboard-empty {
      color: #aaa;
      font-style: italic;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
      <h1>FLAPPY BIRD</h1>
      <button class="btn" onclick="startGame()">PLAY</button>
      <button class="btn" onclick="showLeaderboard()">LEADERBOARD</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay hidden">
      <h1>GAME OVER</h1>
      
      <div class="score-badge">
        <span>Score:</span>
        <span id="final-score">0</span>
      </div>
      <div class="score-badge">
        <span>Best:</span>
        <span id="best-score">0</span>
      </div>

      <div id="save-score-section" class="input-group">
        <input type="text" id="player-name" placeholder="Enter Name" maxlength="10">
        <button class="btn" onclick="submitScore()">SAVE SCORE</button>
      </div>

      <button class="btn" onclick="startGame()">RETRY</button>
      <button class="btn" onclick="showMenu()">MENU</button>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="overlay hidden">
      <h2>HIGH SCORES</h2>
      <table class="leaderboard-table" id="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th style="text-align: right;">Score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <div id="no-scores" class="leaderboard-empty hidden">No scores saved yet!</div>
      <button class="btn" onclick="showMenu()">BACK</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const mainMenu = document.getElementById('main-menu');
    const gameOverMenu = document.getElementById('game-over');
    const leaderboardScreen = document.getElementById('leaderboard-screen');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const playerNameInput = document.getElementById('player-name');
    const saveScoreSection = document.getElementById('save-score-section');
    const leaderboardBody = document.getElementById('leaderboard-body');
    const noScoresEl = document.getElementById('no-scores');

    // State Variables
    let state = 'MENU';
    let score = 0;
    let lastTime = 0;
    let pipeSpawnTimer = 0;

    // Responsive Canvas Sizing
    let scale = 1;
    let groundHeight = 60;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      // Scaling baseline (height: 640px)
      scale = canvas.height / 640;
      groundHeight = 60 * scale;

      // Adjust bird positioning on resize
      bird.x = Math.max(80 * scale, 100);
      bird.radius = 14 * scale;
    }
    window.addEventListener('resize', resizeCanvas);

    // Dynamic Bird Mechanics
    const bird = {
      x: 100,
      y: 250,
      radius: 14,
      velocity: 0,
      rotation: 0,

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Body
        ctx.fillStyle = '#f4c430';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = Math.max(2, 2 * scale);
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.radius * 0.35, -this.radius * 0.3, this.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.radius * 0.45, -this.radius * 0.3, this.radius * 0.15, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();
        ctx.arc(this.radius * 0.5, this.radius * 0.15, this.radius * 0.4, 0, Math.PI);
        ctx.fill();

        ctx.restore();
      },

      flap() {
        // Tuned floaty jump force
        this.velocity = -4.2 * scale;
      },

      update(dt) {
        // Softened gravity scaling
        const gravity = 0.13 * scale;
        this.velocity += gravity * dt;
        this.y += this.velocity * dt;

        // Dynamic Angle Rotation
        if (this.velocity < 0) {
          this.rotation = -0.25;
        } else {
          this.rotation = Math.min(Math.PI / 2, this.rotation + 0.04 * dt);
        }

        // Floor Collision
        if (this.y + this.radius >= canvas.height - groundHeight) {
          this.y = canvas.height - groundHeight - this.radius;
          endGame();
        }

        // Ceiling Collision
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },

      reset() {
        this.y = canvas.height / 2;
        this.velocity = 0;
        this.rotation = 0;
      }
    };

    // Pipes Manager
    const pipes = {
      items: [],

      draw() {
        for (let p of this.items) {
          ctx.fillStyle = '#73bf2e';
          ctx.strokeStyle = '#2d5a0e';
          ctx.lineWidth = Math.max(2, 2 * scale);

          // Top Pipe
          ctx.fillRect(p.x, 0, p.width, p.top);
          ctx.strokeRect(p.x, 0, p.width, p.top);

          // Bottom Pipe
          ctx.fillRect(p.x, p.bottom, p.width, canvas.height - groundHeight - p.bottom);
          ctx.strokeRect(p.x, p.bottom, p.width, canvas.height - groundHeight - p.bottom);
        }
      },

      update(dt) {
        const pipeWidth = Math.max(60, 75 * scale);
        const pipeGap = Math.max(140, 165 * scale);
        const speed = 2.4 * scale * dt;

        // Spawn interval based on time
        pipeSpawnTimer += dt;
        if (pipeSpawnTimer >= 110) {
          pipeSpawnTimer = 0;
          const minTop = 50 * scale;
          const maxTop = canvas.height - groundHeight - pipeGap - (50 * scale);
          const top = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
          const bottom = top + pipeGap;

          this.items.push({
            x: canvas.width,
            width: pipeWidth,
            top: top,
            bottom: bottom,
            passed: false
          });
        }

        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= speed;

          // Collision Box
          if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + p.width &&
            (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
          ) {
            endGame();
          }

          // Score Increment
          if (p.x + p.width < bird.x && !p.passed) {
            score++;
            p.passed = true;
          }

          // Remove Offscreen Pipes
          if (p.x + p.width < 0) {
            this.items.splice(i, 1);
            i--;
          }
        }
      },

      reset() {
        this.items = [];
        pipeSpawnTimer = 0;
      }
    };

    function drawGround() {
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 14 * scale);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - groundHeight);
      ctx.lineTo(canvas.width, canvas.height - groundHeight);
      ctx.stroke();
    }

    function drawScore() {
      if (state === 'PLAYING') {
        const fontSize = Math.max(32, Math.floor(42 * scale));
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = Math.max(3, 4 * scale);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 70 * scale);
        ctx.fillText(score, canvas.width / 2, 70 * scale);
      }
    }

    // Delta-Time Normalized Game Loop
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 16.666, 3); // Normalize to 60 FPS baseline
      lastTime = timestamp;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (state === 'PLAYING') {
        bird.update(dt);
        pipes.update(dt);
      }

      pipes.draw();
      drawGround();
      bird.draw();
      drawScore();

      requestAnimationFrame(gameLoop);
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'PLAYING') {
        bird.flap();
      }
    });

    window.addEventListener('touchstart', (e) => {
      if (state === 'PLAYING' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
        bird.flap();
      }
    });

    canvas.addEventListener('click', () => {
      if (state === 'PLAYING') {
        bird.flap();
      }
    });

    // Navigation & UI Logic
    function showMenu() {
      state = 'MENU';
      hideOverlays();
      mainMenu.classList.remove('hidden');
      resetGameObjects();
    }

    function startGame() {
      state = 'PLAYING';
      hideOverlays();
      resetGameObjects();
    }

    function endGame() {
      state = 'GAMEOVER';
      finalScoreEl.textContent = score;

      const leaderboard = getLeaderboard();
      const best = leaderboard.length > 0 ? leaderboard[0].score : 0;
      bestScoreEl.textContent = Math.max(best, score);

      saveScoreSection.classList.remove('hidden');
      playerNameInput.value = '';

      gameOverMenu.classList.remove('hidden');
    }

    function showLeaderboard() {
      state = 'LEADERBOARD';
      hideOverlays();
      leaderboardScreen.classList.remove('hidden');
      renderLeaderboard();
    }

    function hideOverlays() {
      mainMenu.classList.add('hidden');
      gameOverMenu.classList.add('hidden');
      leaderboardScreen.classList.add('hidden');
    }

    function resetGameObjects() {
      bird.reset();
      pipes.reset();
      score = 0;
    }

    // Leaderboard Storage
    function getLeaderboard() {
      const data = localStorage.getItem('flappy_leaderboard');
      return data ? JSON.parse(data) : [];
    }

    function submitScore() {
      const name = playerNameInput.value.trim() || 'Anonymous';
      const leaderboard = getLeaderboard();

      leaderboard.push({ name, score });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard.splice(10);

      localStorage.setItem('flappy_leaderboard', JSON.stringify(leaderboard));
      saveScoreSection.classList.add('hidden');
      showLeaderboard();
    }

    function renderLeaderboard() {
      const leaderboard = getLeaderboard();
      leaderboardBody.innerHTML = '';

      if (leaderboard.length === 0) {
        noScoresEl.classList.remove('hidden');
        document.getElementById('leaderboard-table').classList.add('hidden');
      } else {
        noScoresEl.classList.add('hidden');
        document.getElementById('leaderboard-table').classList.remove('hidden');

        leaderboard.forEach((entry, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(entry.name)}</td>
            <td>${entry.score}</td>
          `;
          leaderboardBody.appendChild(row);
        });
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Init
    resizeCanvas();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
